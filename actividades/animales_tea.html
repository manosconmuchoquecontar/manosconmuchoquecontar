
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Intervención TEA - Sesión Completa</title>
    <link href="https://fonts.googleapis.com/css2?family=Short+Stack&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #fcfaf2; --accent: #2196F3; --success: #4CAF50; --error: #F44336; }
        body { font-family: 'Short Stack', cursive; background-color: var(--bg-color); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; user-select: none; }
        #game-container { width: 98vw; height: 96vh; background: white; border-radius: 30px; display: flex; flex-direction: column; align-items: center; padding: 10px; box-sizing: border-box; border: 4px solid #eee; position: relative; }
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: space-evenly; }
        .active { display: flex; }
        #exit-btn { position: absolute; top: 10px; right: 10px; padding: 10px; background: #ddd; border-radius: 50%; width: 45px; height: 45px; border: none; cursor: pointer; opacity: 0.3; z-index: 100; font-weight: bold; }
        #exit-btn:active { background: var(--error); opacity: 1; color: white; }
        .question-box { display: flex; align-items: center; background: #e3f2fd; padding: 10px 25px; border-radius: 20px; border: 3px solid var(--accent); gap: 15px; max-width: 90%; }
        .picto-question { width: 80px; height: 80px; background: white; border-radius: 12px; padding: 5px; }
        .question-text { font-size: 1.6rem; color: #1565C0; text-transform: uppercase; font-weight: bold; }
        .animal-main { font-size: 100px; line-height: 1; margin: 5px 0; }
        .animal-label { font-size: 2.8rem; font-weight: bold; color: #333; letter-spacing: 4px; text-transform: uppercase; margin: 0; }
        .options-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 95%; max-width: 900px; }
        .option-card { background: #fff; border: 4px solid #e0e0e0; border-radius: 20px; padding: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .option-card img { width: 100px; height: 100px; object-fit: contain; }
        .correct { border-color: var(--success) !important; background-color: #e8f5e9 !important; transform: scale(1.03); }
        .incorrect { animation: shake 0.5s; border-color: var(--error) !important; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 60% { transform: translateX(10px); } }
        .btn-ui { padding: 25px 50px; font-size: 2.2rem; background: var(--success); color: white; border: none; border-radius: 25px; cursor: pointer; margin: 10px; box-shadow: 0 6px 0 #2e7d32; }
        .btn-report { background: var(--accent); font-size: 1.2rem; box-shadow: 0 6px 0 #1565C0; }
        #progress-container { width: 80%; height: 10px; background: #eee; border-radius: 10px; }
        #progress-fill { height: 100%; background: var(--accent); border-radius: 10px; width: 0%; transition: 0.4s; }
    </style>
</head>
<body>

    <div id="game-container">
        <button id="exit-btn">X</button>

        <div id="screen-start" class="screen active">
            <h1 style="font-size: 3.5rem; color: var(--accent); margin: 0;">LOS ANIMALES</h1>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button class="btn-ui" onclick="toggleFullScreen()">PANTALLA COMPLETA</button>
                <button class="btn-ui" style="background: var(--success)" onclick="start()">EMPEZAR JUEGO</button>
            </div>
            <p style="color: #888;">Salida: Mantén pulsada la X 3 seg.</p>
        </div>

        <div id="screen-game" class="screen">
            <div id="progress-container"><div id="progress-fill"></div></div>
            <div class="question-box">
                <img id="q-picto" src="" class="picto-question">
                <span id="q-text" class="question-text"></span>
            </div>
            <div class="animal-main" id="a-emoji"></div>
            <div class="animal-label" id="a-name"></div>
            <div class="options-grid" id="options-container"></div>
        </div>

        <div id="screen-end" class="screen">
            <h1 style="font-size: 4rem; color: var(--success);">¡TERMINADO! 🌟</h1>
            <p id="stats-summary" style="font-size: 2rem; font-weight: bold;"></p>
            <button class="btn-ui btn-report" onclick="downloadReport()">DESCARGAR INFORME</button>
            <button class="btn-ui" onclick="location.reload()">REPETIR</button>
        </div>
    </div>

    <script>
        const ARASAAC_URL = "https://static.arasaac.org/pictograms/";
        const STEPS = [
            { key: 'color', text: '¿DE QUÉ COLOR ES?', picto: '7075' },
            { key: 'tiene', text: '¿QUÉ TIENE?', picto: '32761' },
            { key: 'come', text: '¿QUÉ COME?', picto: '28641' },
            { key: 'mueve', text: '¿CÓMO SE MUEVE?', picto: '25648' },
            { key: 'vive', text: '¿DÓNDE VIVE?', picto: '11605' }
        ];

        const DATA = [
            { name: "CANGREJO", emoji: "🦀", color: { ok: ["ROJO", "2808"], fail: [["AZUL", "4869"], ["VERDE", "4887"]] }, tiene: { ok: ["PINZAS", "24292"], fail: [["ALAS", "5368"], ["CUERNOS", "5978"]] }, come: { ok: ["PESCADO", "2520"], fail: [["CHOCOLATE", "25940"], ["PAN", "2494"]] }, mueve: { ok: ["CAMINA", "6044"], fail: [["VUELA", "6246"], ["NADAR", "6568"]] }, vive: { ok: ["MAR", "2925"], fail: [["TIERRA", "7149"], ["ÁRBOL", "39265"]] } },
            { name: "LEÓN", emoji: "🦁", color: { ok: ["AMARILLO", "2648"], fail: [["ROJO", "2808"], ["ROSA", "2807"]] }, tiene: { ok: ["PELO", "24256"], fail: [["PICO", "5538"], ["TROMPA", "7287"]] }, come: { ok: ["CARNE", "2316"], fail: [["MANZANA", "2462"], ["QUESO", "2541"]] }, mueve: { ok: ["CAMINA", "6044"], fail: [["VUELA", "6246"], ["SALTA", "2804"]] }, vive: { ok: ["SABANA", "5567"], fail: [["MAR", "2925"], ["HIELO", "3135"]] } },
            { name: "ELEFANTE", emoji: "🐘", color: { ok: ["GRIS", "3340"], fail: [["ROJO", "2808"], ["AMARILLO", "2648"]] }, tiene: { ok: ["TROMPA", "7287"], fail: [["PICO", "5538"], ["PELO", "24256"]] }, come: { ok: ["HIERVA", "3113"], fail: [["CARNE", "2316"], ["QUESO", "2541"]] }, mueve: { ok: ["CAMINA", "6044"], fail: [["VUELA", "6246"], ["SALTA", "2804"]] }, vive: { ok: ["SELVA", "3385"], fail: [["MAR", "2925"], ["HIELO", "3135"]] } },
            { name: "PÁJARO", emoji: "🐦", color: { ok: ["ROJO", "2808"], fail: [["AZUL", "4869"], ["AMARILLO", "2648"]] }, tiene: { ok: ["PICO", "5538"], fail: [["TROMPA", "7287"], ["PELO", "24256"]] }, come: { ok: ["INSECTOS", "7134"], fail: [["CARNE", "2316"], ["HIERVA", "3113"]] }, mueve: { ok: ["VUELA", "6246"], fail: [["CAMINA", "6044"], ["SALTA", "2804"]] }, vive: { ok: ["ÁRBOL", "39265"], fail: [["MAR", "2925"], ["HIELO", "3135"]] } },
            { name: "CABALLO", emoji: "🐎", color: { ok: ["MARRÓN", "2923"], fail: [["AZUL", "4869"], ["AMARILLO", "2648"]] }, tiene: { ok: ["PELO", "24256"], fail: [["TROMPA", "7287"], ["PICO", "5538"]] }, come: { ok: ["PAJA", "6163"], fail: [["CARNE", "2316"], ["PESCADO", "2520"]] }, mueve: { ok: ["TROTAR", "2294"], fail: [["CAMINA", "6044"], ["SALTA", "2804"]] }, vive: { ok: ["CAMPO", "2683"], fail: [["MAR", "2925"], ["HIELO", "3135"]] } },
            { name: "PEZ", emoji: "🐟", color: { ok: ["AZUL", "4869"], fail: [["MARRÓN", "2923"], ["AMARILLO", "2648"]] }, tiene: { ok: ["ESCAMAS", "7085"], fail: [["PELO", "24256"], ["PICO", "5538"]] }, come: { ok: ["ALGAS", "6040"], fail: [["CARNE", "2316"], ["PAJA", "6163"]] }, mueve: { ok: ["NADA", "6568"], fail: [["CAMINA", "6044"], ["SALTA", "2804"]] }, vive: { ok: ["MAR", "2925"], fail: [["CAMPO", "2683"], ["HIELO", "3135"]] } },
            { name: "MONO", emoji: "🐒", color: { ok: ["MARRÓN", "2923"], fail: [["AZUL", "4869"], ["AMARILLO", "2648"]] }, tiene: { ok: ["PELO", "24256"], fail: [["ESCAMAS", "7085"], ["PICO", "5538"]] }, come: { ok: ["FRUTA", "28339"], fail: [["CARNE", "2316"], ["PAJA", "6163"]] }, mueve: { ok: ["TREPAR", "8237"], fail: [["CAMINA", "6044"], ["NADA", "6568"]] }, vive: { ok: ["SABANA", "5567"], fail: [["MAR", "2925"], ["HIELO", "3135"]] } },
            { name: "CERDO", emoji: "🐷", color: { ok: ["ROSA", "2807"], fail: [["AZUL", "4869"], ["AMARILLO", "2648"]] }, tiene: { ok: ["HOCICO", "37591"], fail: [["ESCAMAS", "7085"], ["PICO", "5538"]] }, come: { ok: ["FRUTA", "28339"], fail: [["CARNE", "2316"], ["PAJA", "6163"]] }, mueve: { ok: ["CAMINA", "6044"], fail: [["TREPAR", "8237"], ["NADA", "6568"]] }, vive: { ok: ["GRANJA", "3337"], fail: [["MAR", "2925"], ["HIELO", "3135"]] } }
        ];

        let aIdx = 0, sIdx = 0, canClick = true;
        let log = [];

        // Salida protegida
        let exitT;
        const eb = document.getElementById('exit-btn');
        const startExit = () => exitT = setTimeout(() => document.fullscreenElement && document.exitFullscreen(), 3000);
        const stopExit = () => clearTimeout(exitT);
        eb.addEventListener('mousedown', startExit); eb.addEventListener('mouseup', stopExit);
        eb.addEventListener('touchstart', startExit); eb.addEventListener('touchend', stopExit);

        function toggleFullScreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); }

        function start() {
            document.getElementById('screen-start').classList.remove('active');
            document.getElementById('screen-game').classList.add('active');
            load();
        }

        function load() {
            canClick = true;
            const animal = DATA[aIdx];
            const step = STEPS[sIdx];
            const config = animal[step.key];
            
            document.getElementById('q-picto').src = `${ARASAAC_URL}${step.picto}/${step.picto}_500.png`;
            document.getElementById('q-text').innerText = step.text;
            document.getElementById('a-emoji').innerText = animal.emoji;
            document.getElementById('a-name').innerText = animal.name;

            speak(sIdx === 0 ? animal.name + ". " + step.text : step.text);

            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            let choices = [
                { text: config.ok[0], id: config.ok[1], correct: true },
                { text: config.fail[0][0], id: config.fail[0][1], correct: false },
                { text: config.fail[1][0], id: config.fail[1][1], correct: false }
            ].sort(() => Math.random() - 0.5);

            choices.forEach(c => {
                const card = document.createElement('div');
                card.className = 'option-card';
                card.innerHTML = `<img src="${ARASAAC_URL}${c.id}/${c.id}_500.png"><span style="margin-top:5px; font-weight:bold; font-size:1.1rem;">${c.text}</span>`;
                card.onclick = () => {
                    if(!canClick) return;
                    log.push({ animal: animal.name, step: step.text, choice: c.text, result: c.correct ? "Acierto" : "Error" });
                    if(c.correct) {
                        canClick = false; card.classList.add('correct'); speak("muy bien");
                        setTimeout(() => { sIdx++; if(sIdx >= STEPS.length){ sIdx=0; aIdx++; } if(aIdx >= DATA.length) finish(); else load(); }, 1200);
                    } else {
                        card.classList.add('incorrect'); speak("inténtalo otra vez");
                        setTimeout(() => card.classList.remove('incorrect'), 500);
                    }
                };
                container.appendChild(card);
            });
            document.getElementById('progress-fill').style.width = `${((aIdx * STEPS.length + sIdx) / (DATA.length * STEPS.length)) * 100}%`;
        }

        function finish() {
            document.getElementById('screen-game').classList.remove('active');
            document.getElementById('screen-end').classList.add('active');
            const ok = log.filter(l => l.result === "Acierto").length;
            const err = log.filter(l => l.result === "Error").length;
            document.getElementById('stats-summary').innerText = `Aciertos: ${ok} | Errores: ${err}`;
            speak("sesión terminada, lo has hecho genial");
        }

        function downloadReport() {
            let t = `INFORME TEA - ${new Date().toLocaleString()}\n` + "=".repeat(30) + "\n";
            log.forEach(l => t += `[${l.result}] Animal: ${l.animal} | Pregunta: ${l.step} | Marcó: ${l.choice}\n`);
            const blob = new Blob([t], {type: 'text/plain'});
            const a = document.createElement('a'); a.download = `informe_tea_${new Date().getTime()}.txt`;
            a.href = URL.createObjectURL(blob); a.click();
        }

        function speak(t) {
            const m = new SpeechSynthesisUtterance(t.toLowerCase());
            m.lang = 'es-ES'; m.rate = 0.8;
            window.speechSynthesis.speak(m);
        }
    </script>
</body>
</html>
