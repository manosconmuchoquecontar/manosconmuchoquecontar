<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pares Mínimos - Intervención Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.cdnfonts.com/css/massallera" rel="stylesheet">
    <style>
        :root {
            --primary: #5865F2;
            --success: #2ECC71;
            --error: #E74C3C;
            --bg: #F0F4F8;
        }

        body {
            font-family: 'Massallera', sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Pantallas de Inicio y Parental */
        #startScreen, #parentalModal {
            position: fixed; inset: 0; z-index: 2000;
            background: linear-gradient(135deg, #5865f2 0%, #2e3192 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; padding: 20px; text-align: center;
        }

        #parentalModal { background: rgba(255,255,255,0.98); color: #333; display: none; }

        .app-container {
            display: none;
            background: white;
            width: 95%;
            max-width: 600px;
            padding: 2rem;
            border-radius: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
        }

        h1 { color: var(--primary); font-size: 2.5rem; margin: 0; }
        
        .progress-bar {
            width: 100%; height: 12px; background: #EEE;
            border-radius: 10px; margin: 20px 0; overflow: hidden;
        }

        #progressFill {
            width: 0%; height: 100%; background: var(--success);
            transition: width 0.3s ease;
        }

        .btn-play {
            background: var(--primary); color: white; border: none;
            padding: 18px 35px; font-size: 1.5rem; border-radius: 50px;
            cursor: pointer; margin: 15px 0; font-family: 'Massallera', sans-serif;
            box-shadow: 0 6px 0 #3b44b1; transition: all 0.1s;
        }

        .btn-play:active { transform: translateY(4px); box-shadow: 0 2px 0 #3b44b1; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }

        .card {
            background: #fff; border: 6px solid #EEE; border-radius: 30px;
            padding: 25px; cursor: pointer; transition: all 0.2s ease;
        }

        .card:hover { border-color: var(--primary); transform: translateY(-3px); }
        .card-emoji { font-size: 5rem; display: block; }
        .card-name { font-size: 2rem; color: #333; display: block; margin-top: 10px; font-weight: bold; }

        .correct { border-color: var(--success) !important; background: #E8F8F0 !important; animation: pulse 0.5s; }
        .wrong { border-color: var(--error) !important; background: #FDEDEC !important; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Controles Admin */
        .admin-btns { position: absolute; top: 10px; right: 20px; display: flex; gap: 10px; }
        .btn-admin { background: #ccc; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.8rem; }

        /* Botón Parental */
        .exit-timer-btn {
            width: 200px; height: 200px; border-radius: 50%; border: 10px solid #eee;
            background: var(--error); color: white; font-size: 1.2rem; cursor: pointer;
            position: relative; overflow: hidden; touch-action: none; margin-top: 20px;
        }
        #progress-fill-parental { position: absolute; bottom: 0; width: 100%; background: rgba(255,255,255,0.4); height: 0%; }
    </style>
</head>
<body>

<div id="startScreen">
    <div style="font-size: 6rem; margin-bottom: 20px;">👂</div>
    <h1>PARES MÍNIMOS</h1>
    <p style="font-size: 1.5rem;">Entrena tu oído para diferenciar sonidos</p>
    <button class="btn-play" style="background: var(--success); box-shadow: 0 6px 0 #27ae60;" onclick="startGame()">¡EMPEZAR JUEGO!</button>
</div>

<div class="app-container" id="mainGame">
    <div class="admin-btns">
        <button class="btn-admin" onclick="downloadReport()">📥 Informe</button>
        <button class="btn-admin" onclick="showParental()">⚙️ Salir</button>
    </div>

    <h1>¿Cuál suena?</h1>
    <div class="progress-bar"><div id="progressFill"></div></div>
    
    <button class="btn-play" onclick="speakTarget()">🔊 Escuchar Palabra</button>

    <div class="grid" id="gameGrid"></div>
    <div style="margin-top: 20px; color: #888;">Reto <span id="currentText">1</span> de <span id="totalText">14</span></div>
</div>

<div id="parentalModal">
    <h2 style="font-size: 2.5rem;">Control Parental</h2>
    <p id="math-q" style="font-size: 2rem; margin-bottom: 10px;"></p>
    <input type="number" id="math-a" pattern="\d*" inputmode="numeric" style="font-size: 2rem; width: 120px; text-align: center; border: 3px solid var(--primary); border-radius: 15px; margin-bottom: 20px;">
    
    <button id="exit-btn-parental" class="exit-timer-btn">
        <div id="progress-fill-parental"></div>
        MANTÉN 3s PARA SALIR
    </button>
    <button onclick="hideParental()" style="margin-top:20px; background:none; border:none; text-decoration:underline; cursor:pointer;">Volver</button>
</div>

<script>
    const masterPairs = [
        { pair: ['Bota', 'Dedo'], icons: ['🥾', '☝️'], targetName: 'Bota' },
        { pair: ['Bota', 'Dedo'], icons: ['🥾', '☝️'], targetName: 'Dedo' },
        { pair: ['Sopa', 'Zumo'], icons: ['🍲', '🧃'], targetName: 'Sopa' },
        { pair: ['Sopa', 'Zumo'], icons: ['🍲', '🧃'], targetName: 'Zumo' },
        { pair: ['Pala', 'Taza'], icons: ['⛏️', '☕'], targetName: 'Pala' },
        { pair: ['Pala', 'Taza'], icons: ['⛏️', '☕'], targetName: 'Taza' },
        { pair: ['Rata', 'Lata'], icons: ['🐀', '🥫'], targetName: 'Lata' },
        { pair: ['Rata', 'Lata'], icons: ['🐀', '🥫'], targetName: 'Rata' },
        { pair: ['Toro', 'Dado'], icons: ['🐂', '🎲'], targetName: 'Toro' },
        { pair: ['Toro', 'Dado'], icons: ['🐂', '🎲'], targetName: 'Dado' },
        { pair: ['Mano', 'Nube'], icons: ['✋', '☁️'], targetName: 'Mano' },
        { pair: ['Mano', 'Nube'], icons: ['✋', '☁️'], targetName: 'Nube' },
        { pair: ['Mar', 'Mal'], icons: ['🌊', '👎'], targetName: 'Mar' },
        { pair: ['Mar', 'Mal'], icons: ['🌊', '👎'], targetName: 'Mal' }
    ];

    let gamePool = [];
    let currentIndex = 0;
    let logs = [];
    let exitInterval, exitProgress = 0, mathRes = 0;
    const synth = window.speechSynthesis;

    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function startGame() {
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('mainGame').style.display = 'block';
        if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
        initGame();
    }

    function initGame() {
        gamePool = shuffle([...masterPairs]);
        currentIndex = 0;
        logs = [];
        document.getElementById('totalText').innerText = gamePool.length;
        renderLevel();
    }

    function renderLevel() {
        const grid = document.getElementById('gameGrid');
        grid.innerHTML = '';
        const data = gamePool[currentIndex];
        const displayOrder = Math.random() > 0.5 ? [0, 1] : [1, 0];

        displayOrder.forEach(i => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <span class="card-emoji">${data.icons[i]}</span>
                <span class="card-name">${data.pair[i]}</span>
            `;
            card.onclick = () => checkAnswer(data.pair[i], card);
            grid.appendChild(card);
        });

        updateProgress();
        setTimeout(speakTarget, 600);
    }

    function speakTarget() {
        if (synth.speaking) synth.cancel();
        const utterance = new SpeechSynthesisUtterance(gamePool[currentIndex].targetName);
        utterance.lang = 'es-ES';
        utterance.rate = 0.75;
        synth.speak(utterance);
    }

    function checkAnswer(selectedName, element) {
        const target = gamePool[currentIndex].targetName;
        const timestamp = new Date().toLocaleTimeString();

        if (selectedName === target) {
            logs.push(`[${timestamp}] ACIERTO: Escuchó "${target}" y eligió "${selectedName}"`);
            element.classList.add('correct');
            currentIndex++;
            setTimeout(() => {
                if (currentIndex < gamePool.length) renderLevel();
                else victory();
            }, 1000);
        } else {
            logs.push(`[${timestamp}] FALLO: Escuchó "${target}" pero eligió "${selectedName}"`);
            element.classList.add('wrong');
            speakTarget();
            setTimeout(() => element.classList.remove('wrong'), 800);
        }
    }

    function updateProgress() {
        const progress = (currentIndex / gamePool.length) * 100;
        document.getElementById('progressFill').style.width = `${progress}%`;
        document.getElementById('currentText').innerText = currentIndex + 1;
    }

    function victory() {
        Swal.fire({
            title: '¡Excelente oído!',
            text: 'Has completado todos los pares mínimos.',
            icon: 'success',
            confirmButtonText: 'Guardar y Reiniciar'
        }).then(() => {
            downloadReport();
            initGame();
        });
    }

    // CONTROL PARENTAL LOGIC
    function showParental() {
        const n1 = Math.floor(Math.random() * 9) + 2;
        const n2 = Math.floor(Math.random() * 9) + 2;
        mathRes = n1 + n2;
        document.getElementById('math-q').innerText = `¿Cuánto es ${n1} + ${n2}?`;
        document.getElementById('math-a').value = "";
        document.getElementById('parentalModal').style.display = 'flex';
    }

    function hideParental() { document.getElementById('parentalModal').style.display = 'none'; }

    const exitBtn = document.getElementById('exit-btn-parental');
    const startHandler = (e) => {
        const ans = parseInt(document.getElementById('math-a').value);
        if(ans !== mathRes) { alert("Resuelve la suma primero"); return; }
        exitInterval = setInterval(() => {
            exitProgress += 2;
            document.getElementById('progress-fill-parental').style.height = exitProgress + "%";
            if(exitProgress >= 100) {
                clearInterval(exitInterval);
                if (document.exitFullscreen) document.exitFullscreen();
                location.reload();
            }
        }, 60);
    };
    const endHandler = () => { clearInterval(exitInterval); exitProgress = 0; document.getElementById('progress-fill-parental').style.height = "0%"; };

    exitBtn.addEventListener('mousedown', startHandler);
    exitBtn.addEventListener('touchstart', startHandler);
    exitBtn.addEventListener('mouseup', endHandler);
    exitBtn.addEventListener('touchend', endHandler);

    // INFORME TXT
    function downloadReport() {
        if(logs.length === 0) return;
        const content = `REPORTE DE SESIÓN - PARES MÍNIMOS\nFecha: ${new Date().toLocaleDateString()}\n---------------------------------\n` + logs.join('\n');
        const blob = new Blob([content], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `sesion_pares_minimos_${new Date().getTime()}.txt`;
        a.click();
    }
</script>

</body>
</html>
