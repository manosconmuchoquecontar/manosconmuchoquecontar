<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aventura de Pares Mínimos - EdTech</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+DE+Grund:wght@100..400&family=Playwrite+HR+Lijeva:wght@100..400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --pastel-blue: #E1F5FE;
            --pastel-green: #E8F5E9;
            --pastel-pink: #FCE4EC;
            --pastel-yellow: #FFF9C4;
            --primary: #90CAF9;
            --success: #A5D6A7;
            --error: #EF9A9A;
            --text-color: #546E7A;
            --font-mayus: 'Playwrite DE Grund', sans-serif;
            --font-minus: 'Playwrite HR Lijeva', sans-serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--pastel-blue);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            font-family: var(--font-mayus);
            color: var(--text-color);
        }

        /* Letras Flotantes de Fondo */
        .bg-letters {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none; overflow: hidden;
        }
        .floating-letter {
            position: absolute; font-size: 3rem; font-weight: bold; opacity: 0.2;
            animation: float 15s infinite linear;
        }
        @keyframes float {
            0% { transform: translateY(110vh) rotate(0deg); }
            100% { transform: translateY(-10vh) rotate(360deg); }
        }

        /* Tipografía Dinámica */
        .mode-mayus { text-transform: uppercase; font-family: var(--font-mayus); }
        .mode-minus { text-transform: lowercase; font-family: var(--font-minus); }

        /* Pantallas */
        #startScreen, #parentalModal {
            position: fixed; inset: 0; z-index: 2000;
            background: rgba(255, 255, 255, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; text-align: center;
        }

        #parentalModal { display: none; background: white; }

        .app-container {
            display: none; background: white; width: 95%; max-width: 900px;
            padding: 2rem; border-radius: 50px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            text-align: center; border: 10px solid var(--pastel-yellow);
        }

        /* Botones y UI */
        .btn-mode {
            padding: 15px 25px; font-size: 1.2rem; margin: 10px;
            border: 4px solid #f0f0f0; border-radius: 20px; cursor: pointer;
            transition: 0.3s; background: white;
        }
        .btn-mode.active { background: var(--pastel-pink); border-color: #F06292; }

        .btn-play {
            background: var(--success); color: #2E7D32; border: none;
            padding: 20px 50px; font-size: 2rem; border-radius: 30px;
            cursor: pointer; margin-top: 20px; font-family: inherit;
        }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }

        .card {
            background: white; border: 6px solid #f0f0f0; border-radius: 30px;
            padding: 20px; cursor: pointer; transition: 0.3s;
        }
        .card:hover { transform: scale(1.02); background: var(--pastel-green); }
        .card-emoji { font-size: 5rem; display: block; }
        .card-name { font-size: 1.8rem; display: block; margin-top: 10px; font-family: inherit; }

        .correct { border-color: var(--success); background: #E8F5E9; animation: bounce 0.5s; }
        .wrong { border-color: var(--error); background: #FFEBEE; }

        @keyframes bounce { 0%, 100% {transform: scale(1);} 50% {transform: scale(1.1);} }

        /* Controles Fijos */
        .admin-controls {
            position: fixed; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; z-index: 1000;
        }
        .btn-circle {
            width: 60px; height: 60px; border-radius: 50%; border: none;
            cursor: pointer; font-size: 1.5rem; background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center;
        }

        /* Parental */
        .parental-input { font-size: 2rem; width: 100px; text-align: center; border-radius: 15px; border: 3px solid var(--primary); margin: 20px; }
        .exit-timer-btn {
            width: 150px; height: 150px; border-radius: 50%; border: 8px solid #eee;
            background: var(--error); color: white; font-weight: bold; cursor: pointer;
            position: relative; overflow: hidden;
        }
        #progress-fill-parental { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.2); height: 0%; }
    </style>
</head>
<body class="mode-mayus">

    <div class="bg-letters" id="bgLetters"></div>

    <div id="startScreen">
        <h1 style="font-size: 3.5rem; color: #F06292;">PARES MÍNIMOS</h1>
        <p style="font-size: 1.5rem;">Elige el modo de juego:</p>
        <div style="background: var(--pastel-yellow); padding: 20px; border-radius: 30px; margin-bottom: 20px;">
            <button class="btn-mode active" id="btnMayus" onclick="setMode('mayus')">MAYÚSCULAS</button>
            <button class="btn-mode" id="btnMinus" onclick="setMode('minus')">minúsculas</button>
        </div>
        <button class="btn-play" onclick="startGame()">¡A JUGAR!</button>
    </div>

    <div class="admin-controls" id="adminPanel" style="display: none;">
        <button class="btn-circle" onclick="parentalCheck('home')" title="Inicio">🏠</button>
        <button class="btn-circle" onclick="downloadReport()" title="Informe" style="background: var(--pastel-yellow);">📥</button>
        <button class="btn-circle" onclick="parentalCheck('exit')" title="Salir" style="background: var(--error); color: white;">✕</button>
    </div>

    <div class="app-container" id="mainGame">
        <h2 id="instruccion">¿Dónde está...?</h2>
        <button class="btn-play" onclick="speakTarget()" style="font-size: 1.2rem; padding: 10px 20px; background: var(--pastel-blue);">🔊 Repetir palabra</button>
        <div class="grid" id="gameGrid"></div>
        <p style="margin-top: 20px; opacity: 0.5;">Aciertos: <span id="hits">0</span> | Errores: <span id="fails">0</span></p>
    </div>

    <div id="parentalModal">
        <h2>ZONA DE SEGURIDAD</h2>
        <p id="math-q"></p>
        <input type="number" id="math-a" class="parental-input" placeholder="?">
        <div id="exit-container" style="display:none;">
            <button id="exit-btn-parental" class="exit-timer-btn">
                <div id="progress-fill-parental"></div>
                MANTÉN 3s
            </button>
        </div>
        <button onclick="hideParental()" style="margin-top: 20px; background: none; border: none; color: #999; cursor: pointer;">Cancelar</button>
    </div>

<script>
    const pairs = [
        { pair: ['BOTA', 'DOTA'], icons: ['🥾', '🎁'], target: 'BOTA' }, // b-d
        { pair: ['BOTA', 'DOTA'], icons: ['🥾', '🎁'], target: 'DOTA' },
        { pair: ['SOPA', 'ZOPA'], icons: ['🍲', '🥣'], target: 'SOPA' }, // s-z (uso visual similar para foco fonológico)
        { pair: ['PALA', 'TALA'], icons: ['⛏️', '🪓'], target: 'PALA' }, // p-t
        { pair: ['PALA', 'TALA'], icons: ['⛏️', '🪓'], target: 'TALA' },
        { pair: ['RATA', 'LATA'], icons: ['🐀', '🥫'], target: 'RATA' }, // r-l
        { pair: ['RATA', 'LATA'], icons: ['🐀', '🥫'], target: 'LATA' },
        { pair: ['TOMA', 'DOMA'], icons: ['🍎', '🏇'], target: 'TOMA' }, // t-d
        { pair: ['MANO', 'NANO'], icons: ['✋', '👶'], target: 'MANO' }  // m-n
    ];

    let currentMode = 'mayus';
    let currentIndex = 0;
    let stats = { hits: 0, fails: 0, logs: [] };
    let mathRes = 0;
    let parentalAction = '';
    let exitInterval, exitProgress = 0;

    // Crear fondo dinámico
    function createBg() {
        const letters = "BDSPT R L M N Z".split(" ");
        const container = document.getElementById('bgLetters');
        for(let i=0; i<20; i++) {
            const span = document.createElement('span');
            span.className = 'floating-letter';
            span.innerText = letters[Math.floor(Math.random()*letters.length)];
            span.style.left = Math.random() * 100 + "vw";
            span.style.animationDuration = (Math.random() * 10 + 5) + "s";
            span.style.color = `hsl(${Math.random() * 360}, 70%, 80%)`;
            container.appendChild(span);
        }
    }

    function setMode(mode) {
        currentMode = mode;
        document.body.className = mode === 'mayus' ? 'mode-mayus' : 'mode-minus';
        document.getElementById('btnMayus').classList.toggle('active', mode === 'mayus');
        document.getElementById('btnMinus').classList.toggle('active', mode === 'minus');
    }

    function startGame() {
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('mainGame').style.display = 'block';
        document.getElementById('adminPanel').style.display = 'flex';
        if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
        initLevel();
    }

    function initLevel() {
        const data = pairs[Math.floor(Math.random() * pairs.length)];
        const grid = document.getElementById('gameGrid');
        grid.innerHTML = '';
        
        const indices = [0, 1].sort(() => Math.random() - 0.5);
        indices.forEach(i => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<span class="card-emoji">${data.icons[i]}</span><span class="card-name">${data.pair[i]}</span>`;
            card.onclick = () => checkAnswer(data.pair[i], data.target, card);
            grid.appendChild(card);
        });
        
        stats.currentTarget = data.target;
        setTimeout(speakTarget, 500);
    }

    function speakTarget() {
        const msg = new SpeechSynthesisUtterance(stats.currentTarget);
        msg.lang = 'es-ES';
        msg.rate = 0.7;
        window.speechSynthesis.speak(msg);
    }

    function checkAnswer(selected, target, element) {
        const now = new Date().toLocaleTimeString();
        if(selected === target) {
            stats.hits++;
            stats.logs.push({ hora: now, estimulo: target, respuesta: selected, resultado: 'CORRECTO' });
            element.classList.add('correct');
            document.getElementById('hits').innerText = stats.hits;
            setTimeout(initLevel, 1000);
        } else {
            stats.fails++;
            stats.logs.push({ hora: now, estimulo: target, respuesta: selected, resultado: 'ERROR' });
            element.classList.add('wrong');
            document.getElementById('fails').innerText = stats.fails;
            speakTarget();
            setTimeout(() => element.classList.remove('wrong'), 500);
        }
    }

    // Parental Logic
    function parentalCheck(action) {
        parentalAction = action;
        const n1 = Math.floor(Math.random() * 9) + 1;
        const n2 = Math.floor(Math.random() * 9) + 1;
        mathRes = n1 + n2;
        document.getElementById('math-q').innerText = `¿Cuánto es ${n1} + ${n2}?`;
        document.getElementById('math-a').value = '';
        document.getElementById('exit-container').style.display = action === 'exit' ? 'block' : 'none';
        document.getElementById('parentalModal').style.display = 'flex';
    }

    function hideParental() { document.getElementById('parentalModal').style.display = 'none'; clearInterval(exitInterval); }

    document.getElementById('math-a').addEventListener('input', (e) => {
        if(parseInt(e.target.value) === mathRes) {
            if(parentalAction === 'home') location.reload();
            // Si es exit, debe mantener el botón
        }
    });

    const exitBtn = document.getElementById('exit-btn-parental');
    const startExit = () => {
        if(parseInt(document.getElementById('math-a').value) !== mathRes) return;
        exitInterval = setInterval(() => {
            exitProgress += 2;
            document.getElementById('progress-fill-parental').style.height = exitProgress + '%';
            if(exitProgress >= 100) {
                if (document.exitFullscreen) document.exitFullscreen();
                location.reload();
            }
        }, 60);
    };
    const stopExit = () => { clearInterval(exitInterval); exitProgress = 0; document.getElementById('progress-fill-parental').style.height = '0%'; };

    exitBtn.onmousedown = startExit; exitBtn.ontouchstart = startExit;
    exitBtn.onmouseup = stopExit; exitBtn.ontouchend = stopExit;

    function downloadReport() {
        let rows = stats.logs.map(l => `<tr><td>${l.hora}</td><td>${l.estimulo}</td><td>${l.respuesta}</td><td>${l.resultado}</td></tr>`).join('');
        const html = `<html><head><meta charset="utf-8"><style>table{width:100%;border-collapse:collapse;}td,th{border:1px solid #ddd;padding:8px;}th{background:#f2f2f2;}</style></head><body>
            <h2>Informe de Aventura de Pares Mínimos</h2>
            <p>Aciertos: ${stats.hits} | Errores: ${stats.fails}</p>
            <table><tr><th>Hora</th><th>Estímulo</th><th>Respuesta</th><th>Resultado</th></tr>${rows}</table>
            </body></html>`;
        const blob = new Blob([html], {type: 'text/html'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `reporte_logopedia_${Date.now()}.html`;
        a.click();
    }

    createBg();
</script>
</body>
</html>
