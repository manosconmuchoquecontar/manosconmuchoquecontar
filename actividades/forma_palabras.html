<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Constructor de Sílabas Pro - Letra Ligada</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Varela+Round&family=Playwrite+HR+Lijeva:wght@100..400&display=swap');

        :root {
            --level1: #4CAF50;
            --level2: #2196F3;
            --level3: #FF9800;
            --danger: #f44336;
            --font-main: 'Varela Round', sans-serif;
            --font-ligada: 'Playwrite HR Lijeva', cursive;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            font-family: var(--font-main);
            background-color: #f0f8ff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* ANTESALA */
        #splash-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #6dd5ed 0%, #2193b0 100%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .bg-emoji {
            position: absolute;
            font-size: 2rem;
            opacity: 0.2;
            animation: float 6s infinite ease-in-out;
            z-index: -1;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(20deg); }
        }

        .welcome-box {
            background: rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 40px;
            backdrop-filter: blur(10px);
            margin-bottom: 20px;
        }

        .level-card {
            background: white;
            color: #333;
            width: 95%;
            max-width: 550px;
            padding: 20px;
            margin: 10px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }

        /* JUEGO */
        #game-container {
            background: white;
            width: 98vw;
            height: 96vh;
            border-radius: 40px;
            border: 8px solid #eee;
            display: flex;
            flex-direction: column;
            padding: 15px;
            position: relative;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }

        .btn-system {
            width: 55px; height: 55px;
            border-radius: 20px; border: none;
            cursor: pointer; color: white; font-size: 1.6rem;
            display: flex; align-items: center; justify-content: center;
        }

        #main-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
        }

        #target-icon {
            font-size: clamp(5rem, 15vh, 8rem);
            padding: 20px;
            background: #fff;
            border-radius: 40px;
            border: 6px solid #f9f9f9;
        }

        #word-slots { display: flex; gap: 20px; min-height: 100px; }
        
        .slot {
            width: clamp(70px, 15vw, 120px);
            height: 90px;
            border-bottom: 8px solid #ddd;
            display: flex;
            align-items: center; justify-content: center;
            font-family: var(--font-ligada);
            font-size: 2.5rem;
            color: #2196F3;
            text-transform: lowercase;
        }

        #syllables-bank {
            display: flex; flex-wrap: wrap; gap: 15px;
            justify-content: center; padding: 25px;
            background: #fdfdfd; border-radius: 35px; width: 100%;
            border: 3px dashed #eee;
        }

        .syllable-card {
            padding: 15px 35px; 
            background: white;
            border: 4px solid #ddd; 
            border-radius: 20px;
            font-family: var(--font-ligada);
            font-size: 2.2rem; 
            font-weight: 400;
            text-transform: lowercase;
            cursor: pointer;
            box-shadow: 0 6px 0 #ccc;
            color: #333;
        }

        .syllable-card:active { transform: translateY(6px); box-shadow: none; }

        #btn-listen-again {
            font-family: var(--font-ligada);
            font-size: 1.5rem;
            text-transform: lowercase;
            background: #fff9c4; border: 3px solid #fdd835;
            padding: 12px 35px; border-radius: 60px;
            cursor: pointer; color: #333;
            display: flex; align-items: center; gap: 12px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div id="emoji-bg-container"></div>
        <div class="welcome-box">
            <h1 style="font-size: 3rem;">🌟 ¿Cómo se llama? 🌟</h1>
            <p style="font-size: 1.5rem;">Forma las palabras que escuchas</p>
        </div>
        
        <div class="level-card" onclick="startGame(1)">
            <div style="font-size: 3rem;">🌱</div>
            <div style="text-align: left;">
                <h2 style="color: var(--level1)">Nivel 1</h2>
                <p>Palabras bisílabas directas</p>
            </div>
        </div>

        <div class="level-card" onclick="startGame(2)">
            <div style="font-size: 3rem;">🚀</div>
            <div style="text-align: left;">
                <h2 style="color: var(--level2)">Nivel 2</h2>
                <p>Palabras trisílabas directas</p>
            </div>
        </div>

        <div class="level-card" onclick="startGame(3)">
            <div style="font-size: 3rem;">🏆</div>
            <div style="text-align: left;">
                <h2 style="color: var(--level3)">Nivel 3</h2>
                <p>Palabras con sílabas trabadas</p>
            </div>
        </div>
    </div>

    <div id="game-container" class="hidden">
        <div class="top-bar">
            <button class="btn-system" style="background: #ff5722;" onclick="location.reload()">🏠</button>
            <div id="level-indicator" style="font-weight: bold; font-size: 1.5rem; color: #666;"></div>
            <div style="display: flex; gap: 12px;">
                <button class="btn-system" style="background: #9c27b0;" onclick="generateReport()">📋</button>
                <button id="btn-fs" class="btn-system" style="background: #607d8b;" onclick="toggleFS()">⛶</button>
            </div>
        </div>

        <div id="main-stage">
            <div id="target-icon">❓</div>
            <div id="word-slots"></div>
            <button id="btn-listen-again" onclick="speakCurrentWord()">
                <span>🔊</span> volver a escuchar
            </button>
            <div id="syllables-bank"></div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    const synth = window.speechSynthesis;
    const fillerSyllables = ['ma', 'pe', 'ta', 'lo', 'su', 'ri', 'bo', 'na', 'co', 'lu', 'de', 'fi', 'ga', 'se', 'ti', 'po', 'ru', 'za', 'me', 'li'];

    const wordBank = {
        1: [
            {p:'CASA', s:['ca','sa'], i:'🏠'}, {p:'MESA', s:['me','sa'], i:'🪑'},
            {p:'PATO', s:['pa','to'], i:'🦆'}, {p:'GATO', s:['ga','to'], i:'🐱'},
            {p:'LUNA', s:['lu','na'], i:'🌙'}, {p:'BOCA', s:['bo','ca'], i:'👄'},
            {p:'PIPA', s:['pi','pa'], i:'🚬'}, {p:'MONO', s:['mo','no'], i:'🐒'},
            {p:'SAPO', s:['sa','po'], i:'🐸'}, {p:'LOBO', s:['lo','bo'], i:'🐺'},
            {p:'ROSA', s:['ro','sa'], i:'🌹'}, {p:'PIÑA', s:['pi','ña'], i:'🍍'},
            {p:'PERA', s:['pe','ra'], i:'🍐'}, {p:'SOPA', s:['so','pa'], i:'🥣'},
            {p:'VACA', s:['va','ca'], i:'🐄'}, {p:'BOTA', s:['bo','ta'], i:'🥾'},
            {p:'MOTO', s:['mo','to'], i:'🛵'}, {p:'NUBE', s:['nu','be'], i:'☁️'},
            {p:'COPA', s:['co','pa'], i:'🏆'}, {p:'PALA', s:['pa','la'], i:'🧹'}
        ],
        2: [
            {p:'PELOTA', s:['pe','lo','ta'], i:'⚽'}, {p:'TOMATE', s:['to','ma','te'], i:'🍅'},
            {p:'MALETA', s:['ma','le','ta'], i:'🧳'}, {p:'CABALLO', s:['ca','ba','llo'], i:'🐎'},
            {p:'COMIDA', s:['co','mi','da'], i:'🍱'}, {p:'ESPEJO', s:['es','pe','jo'], i:'🪞'},
            {p:'PÁJARO', s:['pá','ja','ro'], i:'🐦'}, {p:'ZAPATO', s:['za','pa','to'], i:'👞'},
            {p:'CAMINO', s:['ca','mi','no'], i:'🛤️'}, {p:'CÁMARA', s:['cá','ma','ra'], i:'📷'},
            {p:'MÁQUINA', s:['má','qui','na'], i:'⚙️'}, {p:'NEVERA', s:['ne','ve','ra'], i:'🧊'},
            {p:'SÁBANA', s:['sá','ba','na'], i:'🛌'}, {p:'COMETA', s:['co','me','ta'], i:'🪁'},
            {p:'PIRATA', s:['pi','ra','ta'], i:'🏴‍☠️'}, {p:'REGALO', s:['re','ga','lo'], i:'🎁'},
            {p:'COCINA', s:['co','ci','na'], i:'🍳'}, {p:'BALLENA', s:['ba','lle','na'], i:'🐋'},
            {p:'COLEGIO', s:['co','le','gio'], i:'🏫'}, {p:'CEREZA', s:['ce','re','za'], i:'🍒'}
        ],
        3: [
            {p:'TROMPO', s:['trom','po'], i:'🪀'}, {p:'ESTRELLA', s:['es','tre','lla'], i:'⭐'},
            {p:'PLÁTANO', s:['plá','ta','no'], i:'🍌'}, {p:'GLOBO', s:['glo','bo'], i:'🎈'},
            {p:'BRAZO', s:['bra','zo'], i:'💪'}, {p:'FRUTA', s:['fru','ta'], i:'🍎'},
            {p:'CHICLE', s:['chi','cle'], i:'🍬'}, {p:'DRAGÓN', s:['dra','gón'], i:'🐲'},
            {p:'TRACTOR', s:['trac','tor'], i:'🚜'}, {p:'BLUSA', s:['blu','sa'], i:'👚'},
            {p:'PLATO', s:['pla','to'], i:'🍽️'}, {p:'FRESA', s:['fre','sa'], i:'🍓'},
            {p:'TIGRE', s:['ti','gre'], i:'🐅'}, {p:'LIBRO', s:['li','bro'], i:'📚'},
            {p:'CEBRA', s:['ce','bra'], i:'🦓'}, {p:'PUEBLO', s:['pue','blo'], i:'🏘️'},
            {p:'GRANJA', s:['gran','ja'], i:'🚜'}, {p:'CRUZ', s:['cruz'], i:'✝️'},
            {p:'PREMIO', s:['pre','mio'], i:'🥇'}, {p:'BRÚJULA', s:['brú','ju','la'], i:'🧭'}
        ]
    };

    let selectedLevel = 1, currentWord = null, userProgress = [], sessionLog = [], usedWords = [];

    function createEmojiBG() {
        const container = document.getElementById('emoji-bg-container');
        ['🎈','🧩','🎨','⭐','🌈','🍎','🐱','⚽','🚗'].forEach(emoji => {
            for(let i=0; i<3; i++) {
                const s = document.createElement('span'); s.className = 'bg-emoji';
                s.innerText = emoji; s.style.left = Math.random()*90+'vw';
                s.style.top = Math.random()*90+'vh'; s.style.animationDelay = Math.random()*5+'s';
                container.appendChild(s);
            }
        });
    }
    createEmojiBG();

    async function startGame(level) {
        selectedLevel = level; usedWords = [];
        document.getElementById('splash-screen').classList.add('hidden');
        document.getElementById('game-container').classList.remove('hidden');
        document.getElementById('level-indicator').innerText = `Nivel ${level}`;
        loadWord();
    }

    function loadWord() {
        const pool = wordBank[selectedLevel];
        if (usedWords.length === pool.length) usedWords = [];
        let pick; do { pick = pool[Math.floor(Math.random() * pool.length)]; } while (usedWords.includes(pick.p));
        currentWord = pick; usedWords.push(pick.p); userProgress = [];

        document.getElementById('target-icon').innerText = currentWord.i;
        const slots = document.getElementById('word-slots'); slots.innerHTML = '';
        currentWord.s.forEach(() => { const d = document.createElement('div'); d.className = 'slot'; slots.appendChild(d); });

        let bankSyllables = [...currentWord.s];
        while(bankSyllables.length < currentWord.s.length + 3) {
            const randomFiller = fillerSyllables[Math.floor(Math.random()*fillerSyllables.length)];
            if(!bankSyllables.includes(randomFiller)) bankSyllables.push(randomFiller);
        }

        const bank = document.getElementById('syllables-bank'); bank.innerHTML = '';
        bankSyllables.sort(() => Math.random() - 0.5).forEach(sil => {
            const b = document.createElement('div'); b.className = 'syllable-card'; b.innerText = sil;
            b.onclick = () => checkSyllable(sil, b); bank.appendChild(b);
        });
        speakCurrentWord();
    }

    function speakCurrentWord() { speak(currentWord.p); }

    function checkSyllable(sil, element) {
        const expected = currentWord.s[userProgress.length];
        if (sil === expected) {
            userProgress.push(sil);
            document.querySelectorAll('.slot')[userProgress.length-1].innerText = sil;
            element.style.visibility = 'hidden';
            logAction('ACIERTO', sil, expected);
            if (userProgress.length === currentWord.s.length) {
                setTimeout(async () => { await speak("¡Muy bien!"); loadWord(); }, 600);
            }
        } else {
            logAction('ERROR', sil, expected);
            element.style.borderColor = 'var(--danger)';
            speak("no");
            setTimeout(() => element.style.borderColor = '#ddd', 500);
        }
    }

    function logAction(res, got, exp) {
        sessionLog.push({h: new Date().toLocaleTimeString(), l: selectedLevel, p: currentWord.p, r: res, pulsado: got, esperado: exp});
    }

    function toggleFS() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else {
            const n1 = Math.floor(Math.random()*5)+5, n2 = Math.floor(Math.random()*5)+1;
            Swal.fire({ title: 'Control Parental', text: `Resuelve: ${n1} + ${n2}`, input: 'number' })
            .then(r => { if(parseInt(r.value) === (n1+n2)) document.exitFullscreen(); });
        }
    }

    function generateReport() {
        let rows = sessionLog.map(l => `<tr><td>${l.h}</td><td>${l.l}</td><td>${l.p}</td><td style="color:${l.r==='ACIERTO'?'green':'red'}">${l.r}</td><td>${l.pulsado}</td><td>${l.esperado}</td></tr>`).join('');
        const html = `<html><body style="font-family:sans-serif; padding:20px;"><h2>Informe de Desempeño</h2><table border="1" style="width:100%; border-collapse:collapse"><thead><tr style="background:#eee"><th>Hora</th><th>Nivel</th><th>Palabra</th><th>Resultado</th><th>Tocado</th><th>Esperado</th></tr></thead><tbody>${rows}</tbody></table></body></html>`;
        const blob = new Blob([html], {type: 'text/html'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'informe.html'; a.click();
    }

    function speak(t) {
        return new Promise(r => {
            const m = new SpeechSynthesisUtterance(t); m.lang = 'es-ES'; m.rate = 0.8; m.onend = r; synth.speak(m);
        });
    }
</script>
</body>
</html>
