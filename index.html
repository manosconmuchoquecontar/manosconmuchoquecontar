<style>

    --bg: #F5FAFA;
    --bg2: #E8F4F2;
    --ink: #1A3A38;

    --ink3: #8AADAA;

    --coral-light: #E0F5F2;
    --coral-mid: #52BEB2;
    --teal: #1A7A6E;
    --teal-light: #D4F0EC;
    --teal-mid: #3AA99A;
    --amber: #E07A50;
    --amber-light: #FEF0EA;
    --purple: #2A7D8C;
    --purple-light: #E0F2F5;
    --green: #3D8C6E;
    --green-light: #E0F5EC;
    --card-bg: #FFFFFF;
    --border: rgba(26,58,56,0.10);
    --radius: 20px;
    --radius-sm: 12px;
  }
 
  * { box-sizing: border-box; margin: 0; padding: 0; }
 
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }
 
  /* ── NAV ── */
  nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(245,250,250,0.96);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex; align-items: center; justify-content: space-between;

  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    text-decoration: none; color: var(--ink);
  }
  .logo-icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--coral); display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .logo-text { font-family: 'Fraunces', serif; font-size: 15px; font-weight: 700; line-height: 1.2; }
  .logo-text span { display: block; font-family: 'Nunito', sans-serif; font-size: 11px; font-weight: 400; color: var(--ink3); letter-spacing: 0.08em; text-transform: uppercase; }
  nav ul { list-style: none; display: flex; gap: 2rem; }
  nav ul a { text-decoration: none; color: var(--ink2); font-size: 14px; font-weight: 500; transition: color .2s; }
  nav ul a:hover { color: var(--coral); }
  nav ul a.active { color: var(--coral); }
 
  /* ── HERO ── */
  .hero-wrapper {
    background: linear-gradient(160deg, #D4F0EC 0%, #E8F4F2 60%, #F0FAF8 100%);
    border-bottom: 1px solid var(--border);
    padding: 1px 0;
  }
  .hero {
    padding: 6rem 2rem 5rem;
    max-width: 900px; margin: 0 auto; text-align: center;
  }
  .hero h1 {
    font-family: 'Fraunces', serif;
    font-size: clamp(2.8rem, 6vw, 5rem);
    font-weight: 900; line-height: 1.1;
    color: var(--ink); margin-bottom: 1.5rem;
  }
  .hero h1 em { font-style: italic; color: var(--coral); }
  .hero p {
    font-size: 1.15rem; color: var(--ink2); line-height: 1.7;
    max-width: 520px; margin: 0 auto 2.5rem;
  }
  .btn-primary {
    display: inline-block; padding: 14px 32px;
    background: var(--coral); color: white;
    font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 600;
    border-radius: 100px; text-decoration: none;
    transition: background .2s, transform .15s;
  }
  .btn-primary:hover { background: #1A7A6E; transform: translateY(-1px); }
 
  /* ── STATS ── */
  .stats {
    display: flex; justify-content: center; gap: 3rem;
    padding: 2rem; border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    background: linear-gradient(135deg, #D4F0EC 0%, #E0F2F5 100%); margin: 0;
  }
  .stat { text-align: center; }
  .stat strong { display: block; font-family: 'Fraunces', serif; font-size: 2rem; font-weight: 700; color: var(--ink); }
  .stat span { font-size: 13px; color: var(--ink3); }
 
  /* ── AREAS / FILTROS ── */
  .section { max-width: 1200px; margin: 0 auto; padding: 4rem 2rem; }
  .section-header {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;
  }
  .section-header h2 {
    font-family: 'Fraunces', serif;
    font-size: 1.8rem; font-weight: 700;
  }
 
  .filters {
    display: flex; gap: 0.5rem; flex-wrap: wrap;
    margin-bottom: 2.5rem;
  }
  .filter-btn {
    padding: 8px 18px; border-radius: 100px;
    border: 1.5px solid var(--border);
    background: white; color: var(--ink2);
    font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all .2s;
  }
  .filter-btn:hover { border-color: var(--coral); color: var(--coral); }
  .filter-btn.active {
    background: var(--coral); color: white; border-color: var(--coral);
  }
 
  /* ── SEARCH ── */
  .search-bar {
    display: flex; align-items: center;
    background: white; border: 1.5px solid var(--border);
    border-radius: 100px; padding: 0 1rem;
    max-width: 360px; gap: 8px;
  }
  .search-bar input {
    border: none; outline: none; background: transparent;
    font-family: 'Nunito', sans-serif; font-size: 14px; color: var(--ink);
    padding: 10px 0; width: 100%;
  }
 
  /* ── GRID ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1.5rem;
  }
 
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: transform .2s, box-shadow .2s;
    cursor: pointer;
    display: flex; flex-direction: column;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(28,28,26,0.10); }
 
  .card-thumb {
    width: 100%; height: 190px; overflow: hidden;
    background: var(--bg2);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .card-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .card-thumb .area-badge {
    position: absolute; top: 12px; left: 12px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 4px 12px; border-radius: 100px;
  }
 
  .card-body { padding: 1.25rem; flex: 1; display: flex; flex-direction: column; }
  .card-body h3 { font-size: 1rem; font-weight: 600; line-height: 1.4; margin-bottom: 0.5rem; }
  .card-body p { font-size: 13px; color: var(--ink2); line-height: 1.6; flex: 1; }
 
  .card-footer {
    padding: 1rem 1.25rem;
    border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .card-author { font-size: 12px; color: var(--ink3); }
  .card-level {
    font-size: 11px; font-weight: 600;
    padding: 3px 10px; border-radius: 100px;
    background: var(--bg2); color: var(--ink2);
  }
 
  /* ── COLORES POR ÁREA ── */
  .area-fonologica { background: #D4F0EC; color: #1A7A6E; }
  .area-discriminacion { background: #FEE8D6; color: #C4581A; }
  .area-memoria { background: #E8E0F5; color: #6040A0; }
  .area-atencion { background: #FDE8EE; color: #B03060; }
  .area-lectoescritura { background: #EEF5D8; color: #4A7A20; }
  .area-vocabulario { background: #FDE8D8; color: #C45E1A; }
 
  /* MODAL */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(28,28,26,0.6); z-index: 200;
    align-items: center; justify-content: center; padding: 2rem;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: white; border-radius: var(--radius);
    max-width: 800px; width: 100%;
    max-height: 85vh; overflow-y: auto;
  }
  .modal-header { padding: 1.5rem 1.5rem 1rem; display: flex; align-items: start; justify-content: space-between; gap: 1rem; }
  .modal-close { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--ink3); }
  .modal-iframe { width: 100%; height: 480px; border: none; border-top: 1px solid var(--border); }
  .modal-meta { padding: 1rem 1.5rem; font-size: 13px; color: var(--ink2); display: flex; gap: 1rem; flex-wrap: wrap; }
 
  footer {
    text-align: center; padding: 2rem;
    font-size: 13px; color: var(--ink3);
    border-top: 1px solid var(--border);
  }
  footer a { color: var(--coral); text-decoration: none; }
</style>
</head>

  </div>
 
  <div class="filters" id="filters">
    <button class="filter-btn active" data-area="todas">Todas</button>

    <button class="filter-btn" data-area="discriminacion">Discriminación auditiva</button>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">Actividad</h2>
      <button class="modal-close" id="modal-close">✕</button>

    <div class="modal-meta" id="modal-meta"></div>
    <iframe class="modal-iframe" id="modal-iframe" src="" title="Actividad interactiva"></iframe>
  </div>
</div>
 
<script>
var actividades = [
  {
    titulo: "Detective Animal - Inferencias",
    descripcion: "Juego de logopedia para adivinar animales a través de pistas. Trabaja vocabulario y comprensión.",
    area: "atencion",
    nivel: "Infantil / Primaria",
    url: "actividades/inferencias_2.html",
    imagen: "https://i.postimg.cc/SKknQS0B/inferencias-img.jpg"
  },
  {
    titulo: "Isla de Sinfones FL CL GL",
    descripcion: "Discriminación auditiva de sinfones. Ideal para mejorar la articulación y lectura.",
    area: "discriminacion",
    nivel: "2 - 4 Primaria",
    url: "actividades/sinfones_fl_cl_gl.html",
    imagen:"https://i.postimg.cc/0ND689xd/sinfones.jpg"
  }, 
  {
    titulo: "Conteo Silábico",
    descripcion: "Actividad de conciencia fonológica para contar sílabas. Base para aprender a leer.",
    area: "fonologica",
    nivel: "Infantil / 1 Primaria",
    url: "actividades/conteo_silabico.html",
    imagen: "https://i.postimg.cc/4x8vNcJ9/conciencia-fon.jpg"
  },
  {
    titulo: "Los Animales - Intervención TEA",
    descripcion: "Vocabulario con pictogramas ARASAAC para trabajar la comunicación en alumnos con TEA.",
    area: "vocabulario",
    nivel: "Infantil / Primaria",
    url: "actividades/animales_tea.html",
    imagen: "https://i.postimg.cc/7LVRQ3fb/JUEGO-ANIMALES.png"
  },
  {
    titulo: "Detective de Historias",
    descripcion: "Comprensión lectora y memoria auditiva. Juegos educativos para primaria.",
    area: "lectoescritura",
    nivel: "Infantil / Primaria",
    url: "actividades/detective_historias.html",
    imagen: "https://i.postimg.cc/hPM2pQxR/detective.jpg"
  },
  {
    titulo: "Jugamos con las sílabas",
    descripcion: "Conciencia silábica inicial y final para el desarrollo del lenguaje oral.",
    area: "fonologica",
    nivel: "Infantil / Primaria",
    url: "actividades/jugamos_con_silabas.html",
    imagen: "https://i.postimg.cc/76sNwYGs/silabas.jpg"
  },
  {
    titulo: "Tren de los sonidos",
    descripcion: "Memoria auditiva secuencial. Actividad clave en audición y lenguaje.",
    area: "memoria",
    nivel: "Infantil / Primaria",
    url: "actividades/trendesonidos.html",
    imagen: "https://i.postimg.cc/BQVKWMBW/tren-de-sonidos.png"
  },
  {
    titulo: "¿Cómo me llamo?",
    descripcion: "Formación de palabras a través de sílabas. Juego para aprender a leer.",
    area: "fonologica",
    nivel: "Infantil / Primaria",
    url: "actividades/forma_palabras.html",
    imagen: "https://i.postimg.cc/FsLK4r72/palabras.jpg"
  },
  {
    titulo: "Pares mínimos (b–d, s–z, p–t, r–l, t–d, m–n)",
    descripcion: "Discriminación auditiva de sonidos similares para logopedia.",
    area: "discriminacion",
    nivel: "Infantil / Primaria",
    url: "actividades/pares_minimos.html",
    imagen: "https://i.postimg.cc/C1PMPwRf/pares-minimos.jpg"
  },
  {
    titulo: "Cambios Fonológicos",
    descripcion: "Encuentra la letra que cambia. Trabajo avanzado de conciencia fonológica.",
    area: "fonologica",
    nivel: "Infantil / Primaria",
    url: "actividades/cambios_fonologicos.html",
    imagen: "https://i.postimg.cc/yYshN5X6/pseudo.jpg"
  },
  {
    titulo: "Letra inicial vs letra final",
    descripcion: "Identificación de letras en palabras. Refuerzo de lectoescritura.",
    area: "fonologica",
    nivel: "Infantil / Primaria",
    url: "actividades/ letra_inicial.html",
    imagen: "https://i.postimg.cc/FHWyYjjY/letra-inicial.jpg"
  }
];

var areaConfig = {
  fonologica: { label: "Conciencia fonológica", emoji: "🎵", thumb: "thumb-fonologica", badge: "area-fonologica" },
  discriminacion: { label: "Discriminación auditiva", emoji: "👂", thumb: "thumb-discriminacion", badge: "area-discriminacion" },
  memoria: { label: "Memoria", emoji: "🧠", thumb: "thumb-memoria", badge: "area-memoria" },
  atencion: { label: "Atención", emoji: "🎯", thumb: "thumb-atencion", badge: "area-atencion" },
  lectoescritura: { label: "Lectoescritura", emoji: "✏️", thumb: "thumb-lectoescritura", badge: "area-lectoescritura" },
  vocabulario: { label: "Vocabulario y conceptos", emoji: "📚", thumb: "thumb-vocabulario", badge: "area-vocabulario" }
};

var filtroActual = "todas";
var busqueda = "";

function renderGrid() {
  var grid = document.getElementById("grid");
  var empty = document.getElementById("empty");
  var filtradas = actividades.filter(function(a) {
    var matchArea = filtroActual === "todas" || a.area === filtroActual;
    var matchBusqueda = a.titulo.toLowerCase().indexOf(busqueda) !== -1 || a.descripcion.toLowerCase().indexOf(busqueda) !== -1;
    return matchArea && matchBusqueda;
  });

  document.getElementById("stat-total").textContent = actividades.length;

  if (filtradas.length === 0) {
    grid.innerHTML = "";
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";

  grid.innerHTML = filtradas.map(function(a) {
    var cfg = areaConfig[a.area];
    var idx = actividades.indexOf(a);
    var imgHtml = a.imagen ? '<img src="' + a.imagen + '" alt="' + a.titulo + '">' : '<div class="placeholder">' + cfg.emoji + '</div>';
    return '<article class="card" onclick="abrirModal(' + idx + ')">'
      + '<div class="card-thumb ' + cfg.thumb + '">'
      + imgHtml
      + '<span class="area-badge ' + cfg.badge + '">' + cfg.label + '</span>'
      + '</div>'
      + '<div class="card-body">'
      + '<h3>' + a.titulo + '</h3>'
      + '<p>' + a.descripcion + '</p>'
      + '</div>'
      + '<div class="card-footer">'
      + '<span class="card-author">Inma Merino Rus</span>'
      + '<span class="card-level">' + a.nivel + '</span>'
      + '</div>'
      + '</article>';
  }).join("");
}

document.getElementById("filters").addEventListener("click", function(e) {
  if (!e.target.matches(".filter-btn")) return;
  document.querySelectorAll(".filter-btn").forEach(function(b) { b.classList.remove("active"); });
  e.target.classList.add("active");
  filtroActual = e.target.dataset.area;
  renderGrid();
});

document.getElementById("search").addEventListener("input", function(e) {
  busqueda = e.target.value.toLowerCase().trim();
  renderGrid();
});

function abrirModal(idx) {
  var a = actividades[idx];
  var cfg = areaConfig[a.area];
  document.getElementById("modal-title").textContent = a.titulo;
  document.getElementById("modal-meta").innerHTML = '<span class="area-badge ' + cfg.badge + '">' + cfg.label + '</span>' + '<span>Nivel: ' + a.nivel + '</span>';
  document.getElementById("modal-iframe").src = a.url;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}

document.getElementById("modal-close").addEventListener("click", cerrarModal);
function cerrarModal() {
  document.getElementById("modal").classList.remove("open");
  document.getElementById("modal-iframe").src = "";
  document.body.style.overflow = "";
}

renderGrid();
</script>
</body>
</html>
