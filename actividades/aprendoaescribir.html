*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:system-ui,sans-serif;background:#F0F7FF;color:#1A2332;}

/* &#9552;&#9552; SCREENS &#9552;&#9552; */
.screen{position:fixed;inset:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;}
.hidden{display:none!important;}

/* &#9552;&#9552; PANTALLA NOMBRE &#9552;&#9552; */
#s-nombre{background:linear-gradient(145deg,#667EEA,#764BA2);justify-content:center;padding:20px;}
.nombre-card{background:white;border-radius:28px;padding:2rem 1.6rem;
  max-width:360px;width:100%;text-align:center;
  box-shadow:0 24px 60px rgba(0,0,0,.25);}
.nombre-ico{font-size:3.5rem;display:block;margin-bottom:.5rem;
  animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.nombre-h{font-family:'Playwrite HR Lijeva',cursive;font-weight:300;
  font-size:1.6rem;color:#764BA2;margin-bottom:.4rem;}
.nombre-p{color:#6B7A8D;font-size:.85rem;margin-bottom:1.1rem;}
.nombre-inp{width:100%;padding:.8rem 1.1rem;border-radius:14px;
  border:2.5px solid #E8E0FF;font-size:1rem;text-align:center;
  outline:none;margin-bottom:.9rem;transition:border-color .2s;background:#FAFAFF;}
.nombre-inp:focus{border-color:#764BA2;}
.btn-morado{width:100%;padding:.85rem;border:none;border-radius:14px;
  background:linear-gradient(135deg,#667EEA,#764BA2);color:white;
  font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:.5rem;
  box-shadow:0 5px 18px rgba(118,75,162,.4);}
.btn-skip{background:none;border:none;color:#AAA;font-size:.8rem;cursor:pointer;}

/* &#9552;&#9552; PANTALLA INICIO &#9552;&#9552; */
#s-inicio{background:linear-gradient(145deg,#F0F7FF,#E8F0FF);justify-content:center;padding:20px;}
.inicio-card{background:white;border-radius:28px;padding:2rem 1.6rem;
  max-width:380px;width:100%;
  box-shadow:0 12px 36px rgba(74,144,217,.18);border:2px solid #E8F0FF;}
.inicio-icons{font-size:2.6rem;text-align:center;margin-bottom:.5rem;}
.inicio-title{font-family:'Playwrite HR Lijeva',cursive;font-weight:300;
  font-size:1.7rem;color:#1E5FA8;text-align:center;margin-bottom:.3rem;}
.inicio-sub{font-size:.82rem;color:#6B7A8D;text-align:center;margin-bottom:1.3rem;}
.modo-label{font-size:.78rem;color:#6B7A8D;font-weight:700;margin-bottom:.6rem;}
.modo-row{display:flex;gap:10px;margin-bottom:1.3rem;}
.modo-btn{flex:1;padding:.9rem .5rem;border:2.5px solid #EEE;border-radius:16px;
  background:white;cursor:pointer;text-align:center;transition:all .18s;}
.modo-btn.activo{border-color:#4A90D9;background:#E8F3FF;}
.modo-sample{font-size:2rem;display:block;margin-bottom:3px;line-height:1.3;}
.modo-txt{font-size:.74rem;font-weight:700;color:#6B7A8D;}
.btn-azul{width:100%;padding:.9rem;border:none;border-radius:14px;
  background:linear-gradient(135deg,#4A90D9,#1E5FA8);color:white;
  font-size:1rem;font-weight:700;cursor:pointer;
  box-shadow:0 5px 18px rgba(74,144,217,.4);}

/* &#9552;&#9552; PANTALLA JUEGO &#9552;&#9552; */
#s-juego{background:#F0F7FF;}
.header{background:white;padding:10px 14px 8px;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);flex-shrink:0;width:100%;}
.hdr-letra{width:46px;height:46px;border-radius:13px;flex-shrink:0;
  background:linear-gradient(135deg,#4A90D9,#1E5FA8);
  display:flex;align-items:center;justify-content:center;
  font-size:1.5rem;color:white;cursor:pointer;
  font-family:'Playwrite HR Lijeva',cursive;font-weight:300;
  box-shadow:0 3px 10px rgba(74,144,217,.4);}
.hdr-info{flex:1;min-width:0;}
.hdr-nombre{font-size:.68rem;color:#6B7A8D;font-weight:700;}
.hdr-act{font-size:.78rem;color:#1E5FA8;font-weight:700;}
.hdr-dots{display:flex;gap:4px;margin-top:3px;}
.hdr-dot{height:5px;border-radius:3px;background:#EEE;transition:all .35s;}
.hdr-dot.done{background:#27AE60;width:18px;}
.hdr-dot.activo{background:#4A90D9;width:22px;}
.hdr-dot.idle{width:10px;}
.hdr-btns{display:flex;gap:5px;}
.hdr-btn{width:32px;height:32px;border-radius:9px;border:2px solid #EEE;
  background:white;display:flex;align-items:center;justify-content:center;
  font-size:.85rem;cursor:pointer;}
.hdr-btn.danger{border-color:#FFD0C8;}

.act-area{flex:1;overflow-y:auto;padding:14px;width:100%;max-width:430px;
  align-self:center;}

/* &#9552;&#9552; CARD BASE &#9552;&#9552; */
.card{background:white;border-radius:22px;padding:16px;
  box-shadow:0 4px 20px rgba(74,144,217,.12);margin-bottom:12px;}
.act-tit{font-size:.95rem;font-weight:700;color:#1E5FA8;margin-bottom:12px;
  display:flex;align-items:center;gap:8px;}
.badge{background:#E8F3FF;color:#1E5FA8;border-radius:7px;
  padding:2px 8px;font-size:.7rem;margin-left:auto;}

/* &#9552;&#9552; TRAZAR &#9552;&#9552; */
.trazo-wrap{position:relative;width:100%;max-width:320px;aspect-ratio:1;
  margin:0 auto 12px;border-radius:16px;background:white;
  border:2px solid #C8DEFF;box-shadow:0 4px 16px rgba(74,144,217,.1);overflow:hidden;}
.trazo-wrap canvas{position:absolute;inset:0;width:100%;height:100%;}
.trazo-hint{text-align:center;font-size:.78rem;color:#6B7A8D;font-weight:700;margin-bottom:10px;}
.trazo-btns{display:flex;gap:10px;}
.btn-borrar{flex:1;padding:.7rem;border-radius:11px;border:2px solid #FFD0C8;
  background:#FFF5F5;color:#C0392B;font-size:.85rem;font-weight:700;cursor:pointer;}
.btn-listo{flex:2;padding:.7rem;border-radius:11px;border:none;
  background:linear-gradient(135deg,#27AE60,#1E8449);color:white;
  font-size:.85rem;font-weight:700;cursor:pointer;
  box-shadow:0 3px 10px rgba(39,174,96,.3);}

/* &#9552;&#9552; RELLENAR &#9552;&#9552; */
.dots-wrap{position:relative;width:100%;max-width:280px;aspect-ratio:1;
  margin:0 auto 10px;border-radius:16px;background:white;
  border:2px solid #C8DEFF;overflow:hidden;}
.dots-wrap canvas{position:absolute;inset:0;width:100%;height:100%;}
.rel-info{text-align:center;font-size:.8rem;color:#6B7A8D;font-weight:700;margin-bottom:10px;}
.btn-verde{width:100%;padding:.8rem;border-radius:11px;border:none;
  background:linear-gradient(135deg,#27AE60,#1E8449);color:white;
  font-size:.9rem;font-weight:700;cursor:pointer;
  box-shadow:0 3px 10px rgba(39,174,96,.3);}

/* &#9552;&#9552; BUSCAR &#9552;&#9552; */
.buscar-obj{text-align:center;margin-bottom:10px;}
.obj-label{font-size:.78rem;color:#6B7A8D;font-weight:700;margin-bottom:4px;}
.obj-letra-big{display:inline-block;font-size:3rem;font-weight:700;color:white;
  background:linear-gradient(135deg,#4A90D9,#1E5FA8);
  border-radius:14px;padding:.05rem .75rem;
  box-shadow:0 4px 14px rgba(74,144,217,.4);
  animation:pglow 2s ease-in-out infinite;}
@keyframes pglow{0%,100%{box-shadow:0 4px 14px rgba(74,144,217,.4)}
  50%{box-shadow:0 4px 22px rgba(74,144,217,.7)}}
.buscar-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px;}
.buscar-cel{aspect-ratio:1;border-radius:10px;border:2px solid #EEE;
  background:white;display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;font-weight:700;cursor:pointer;transition:all .18s;
  user-select:none;}
.buscar-cel.ok{background:#E8F8F0;border-color:#27AE60;color:#27AE60;animation:popin .3s;}
.buscar-cel.err{background:#FFF0EE;border-color:#E74C3C;color:#E74C3C;animation:shake .3s;}
@keyframes popin{from{transform:scale(.5)}to{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.buscar-prog{text-align:center;font-size:.8rem;font-weight:700;color:#1E5FA8;}

/* &#9552;&#9552; COMPLETAR &#9552;&#9552; */
.comp-prog{text-align:right;font-size:.73rem;color:#6B7A8D;font-weight:700;margin-bottom:8px;}
.comp-tarjeta{background:linear-gradient(135deg,#E8F3FF,#F0E8FF);
  border-radius:16px;padding:16px;text-align:center;margin-bottom:12px;
  border:2px solid #D0E4FF;}
.comp-emoji{font-size:3.2rem;display:block;margin-bottom:6px;}
.comp-palabra{display:flex;align-items:center;justify-content:center;
  gap:2px;flex-wrap:wrap;min-height:50px;}
.letra-ok{font-size:1.8rem;font-weight:300;color:#1A2332;}
.hueco{width:44px;height:48px;border-radius:10px;
  border:3px dashed #4A90D9;background:white;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:1.6rem;font-weight:700;color:#4A90D9;transition:all .3s;}
.hueco.correcto{border-style:solid;border-color:#27AE60;background:#E8F8F0;color:#27AE60;}
.hueco.error{border-color:#E74C3C;background:#FFF0EE;animation:shake .3s;}
.comp-ops{display:flex;gap:12px;justify-content:center;}
.letra-op{width:56px;height:56px;border-radius:13px;
  border:2.5px solid #DDE5F0;background:white;
  display:flex;align-items:center;justify-content:center;
  font-size:1.4rem;font-weight:300;cursor:pointer;transition:all .18s;
  box-shadow:0 2px 8px rgba(0,0,0,.06);}
.letra-op:active{transform:scale(.9);}
.letra-op.disabled{opacity:.3;pointer-events:none;}
#comp-estado{font-size:.82rem;font-weight:700;text-align:center;
  min-height:1.1rem;color:#27AE60;margin-top:6px;}
.btn-sig-comp{width:100%;padding:.82rem;border:none;border-radius:12px;
  background:linear-gradient(135deg,#4A90D9,#1E5FA8);color:white;
  font-size:.95rem;font-weight:700;cursor:pointer;margin-top:8px;
  box-shadow:0 4px 14px rgba(74,144,217,.35);display:none;}
.msg-sig-comp{font-size:.78rem;color:#6B7A8D;font-style:italic;
  text-align:center;margin-top:5px;display:none;}

/* &#9552;&#9552; FIN LETRA &#9552;&#9552; */
.fin-card{background:linear-gradient(135deg,#E8F3FF,#F0E8FF);
  border-radius:22px;padding:24px;text-align:center;
  border:2.5px solid #D0E4FF;}
.fin-letra-big{font-size:5rem;font-weight:300;color:#1E5FA8;display:block;
  margin-bottom:6px;animation:float 2s ease-in-out infinite;}
.fin-titulo{font-size:1.2rem;font-weight:700;color:#1E5FA8;margin-bottom:.3rem;}
.fin-sub{font-size:.82rem;color:#6B7A8D;margin-bottom:1rem;}
.fin-stars{font-size:2rem;margin-bottom:1.1rem;}
.btn-otra{width:100%;padding:.85rem;border:none;border-radius:13px;
  background:linear-gradient(135deg,#4A90D9,#1E5FA8);color:white;
  font-size:.95rem;font-weight:700;cursor:pointer;margin-bottom:.6rem;
  box-shadow:0 4px 14px rgba(74,144,217,.35);}
.btn-informe{width:100%;padding:.78rem;border:none;border-radius:13px;
  background:linear-gradient(135deg,#F39C12,#D68910);color:white;
  font-size:.88rem;font-weight:700;cursor:pointer;
  box-shadow:0 4px 14px rgba(243,156,18,.3);}

/* &#9552;&#9552; SELECTOR LETRAS &#9552;&#9552; */
.letras-ov{position:fixed;inset:0;background:rgba(26,35,50,.7);
  display:none;align-items:flex-end;justify-content:center;z-index:200;
  backdrop-filter:blur(4px);}
.letras-ov.show{display:flex;}
.letras-panel{background:white;border-radius:26px 26px 0 0;
  padding:18px 14px 34px;width:100%;max-width:430px;
  animation:slideup .3s cubic-bezier(.34,1.2,.64,1);max-height:72vh;overflow-y:auto;}
@keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.letras-h{font-size:.9rem;color:#6B7A8D;text-align:center;margin-bottom:12px;font-weight:700;}
.letras-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;}
.letra-pick{aspect-ratio:1;border-radius:10px;border:2.5px solid #EEE;
  background:#F8F8F8;display:flex;align-items:center;justify-content:center;
  font-size:.95rem;font-weight:300;cursor:pointer;transition:all .16s;}
.letra-pick:active{transform:scale(.9);}
.letra-pick.hecha{border-color:#27AE60;background:#E8F8F0;}

/* &#9552;&#9552; LOCK &#9552;&#9552; */
.lock-ov{position:fixed;inset:0;background:rgba(26,35,50,.88);
  display:none;align-items:center;justify-content:center;z-index:800;
  backdrop-filter:blur(6px);}
.lock-ov.show{display:flex;}
.lock-card{background:white;border-radius:26px;padding:2rem 1.7rem;
  text-align:center;max-width:300px;width:92%;
  box-shadow:0 24px 60px rgba(0,0,0,.3);animation:popin .4s cubic-bezier(.34,1.56,.64,1);}
.lock-ico{font-size:2.2rem;margin-bottom:.5rem;}
.lock-h{font-size:1rem;font-weight:700;color:#1E5FA8;margin-bottom:.3rem;}
.lock-desc{font-size:.8rem;color:#6B7A8D;margin-bottom:.2rem;}
.lock-math{font-size:1.8rem;font-weight:700;color:#1A2332;margin:.5rem 0;}
.lock-inp{width:100%;padding:.7rem;border:2.5px solid #C8DEFF;border-radius:11px;
  font-size:1.3rem;font-weight:700;text-align:center;outline:none;margin-bottom:.4rem;}
.lock-err{color:#E74C3C;font-size:.8rem;min-height:1rem;margin-bottom:.3rem;font-weight:700;}
.lock-btn{width:100%;padding:.78rem;border:none;border-radius:11px;
  background:linear-gradient(135deg,#4A90D9,#1E5FA8);color:white;
  font-size:.95rem;font-weight:700;cursor:pointer;margin-bottom:.4rem;}
.lock-cancel{background:none;border:none;color:#BBB;font-size:.76rem;cursor:pointer;}

/* &#9552;&#9552; NOTIF + CONFETTI &#9552;&#9552; */
.notif{position:fixed;top:14px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,#1E5FA8,#764BA2);
  color:white;padding:8px 18px;border-radius:100px;
  font-size:.86rem;font-weight:700;z-index:900;
  opacity:0;transition:opacity .3s;white-space:nowrap;pointer-events:none;
  box-shadow:0 4px 14px rgba(74,144,217,.4);}
.notif.show{opacity:1;}
.cc{position:fixed;inset:0;pointer-events:none;z-index:700;overflow:hidden;}
.cp{position:absolute;animation:caer linear forwards;}
@keyframes caer{0%{transform:translateY(-20px) rotate(0);opacity:1}
  100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>

<div class="cc" id="cc"></div>
<div class="notif" id="notif"></div>

<!-- NOMBRE -->
<div class="screen" id="s-nombre">
  <div class="nombre-card">
    <span class="nombre-ico">&#9999;&#65039;</span>
    <h2 class="nombre-h">&#191;Qui&#233;n practica?</h2>
    <p class="nombre-p">Escribe tu nombre para guardar tu progreso</p>
    <input class="nombre-inp" id="nombre-inp" type="text" placeholder="Tu nombre..."
      maxlength="30" onkeydown="if(event.key==='Enter')irInicio(false)">
    <button class="btn-morado" onclick="irInicio(false)">&#161;A practicar las letras! &#9999;&#65039;</button><br>
    <button class="btn-skip" onclick="irInicio(true)">Continuar sin nombre</button>
  </div>
</div>

<!-- INICIO -->
<div class="screen hidden" id="s-inicio">
  <div class="inicio-card">
    <div class="inicio-icons">&#9999;&#65039; &#128218;</div>
    <h2 class="inicio-title">La Letra</h2>
    <p class="inicio-sub">Practica las letras del abecedario</p>
    <div class="modo-label">&#128292; Elige el tipo de letra:</div>
    <div class="modo-row">
      <div class="modo-btn activo" id="mb-min" onclick="setModo('min',this)">
        <span class="modo-sample" style="font-family:'Playwrite HR Lijeva',cursive;font-weight:300">a</span>
        <div class="modo-txt">Min&#250;sculas</div>
      </div>
      <div class="modo-btn" id="mb-may" onclick="setModo('may',this)">
        <span class="modo-sample" style="font-family:'Playwrite DE Grund',cursive;font-weight:300;text-transform:uppercase">A</span>
        <div class="modo-txt">May&#250;sculas</div>
      </div>
    </div>
    <button class="btn-azul" onclick="abrirSelector()">Elegir una letra &#128292;</button>
  </div>
</div>

<!-- JUEGO -->
<div class="screen hidden" id="s-juego">
  <div class="header">
    <div class="hdr-letra" id="hdr-letra" onclick="abrirSelector()">a</div>
    <div class="hdr-info">
      <div class="hdr-nombre" id="hdr-nombre"></div>
      <div class="hdr-act" id="hdr-act">Trazar</div>
      <div class="hdr-dots" id="hdr-dots">
        <div class="hdr-dot activo"></div>
        <div class="hdr-dot idle"></div>
        <div class="hdr-dot idle"></div>
        <div class="hdr-dot idle"></div>
      </div>
    </div>
    <div class="hdr-btns">
      <button class="hdr-btn" onclick="descargar()" title="Informe">&#128196;</button>
      <button class="hdr-btn" onclick="entrarFS()" title="Pantalla completa">&#x26F6;</button>
      <button class="hdr-btn danger" onclick="pedirSalir()" title="Inicio">&#127968;</button>
    </div>
  </div>
  <div class="act-area" id="act-area"></div>
</div>

<!-- SELECTOR -->
<div class="letras-ov" id="letras-ov" onclick="if(event.target===this)cerrarSelector()">
  <div class="letras-panel">
    <div class="letras-h">&#191;Qu&#233; letra practicamos? &#9999;&#65039;</div>
    <div class="letras-grid" id="letras-grid"></div>
  </div>
</div>

<!-- LOCK -->
<div class="lock-ov" id="lock-ov">
  <div class="lock-card">
    <div class="lock-ico">&#128274;</div>
    <h2 class="lock-h">Control parental</h2>
    <p class="lock-desc" id="lock-desc">Resuelve para continuar:</p>
    <div class="lock-math" id="lock-math"></div>
    <input type="number" class="lock-inp" id="lock-inp" placeholder="?"
      onkeydown="if(event.key==='Enter')checkLock()">
    <div class="lock-err" id="lock-err"></div>
    <button class="lock-btn" onclick="checkLock()">&#10003; Comprobar</button><br>
    <button class="lock-cancel" id="lock-cancel" onclick="hideLock()">Volver al juego</button>
  </div>
</div>

// &#9472;&#9472; NAVEGACION &#9472;&#9472;
function showScreen(id){
  ['s-nombre','s-inicio','s-juego'].forEach(function(s){
    document.getElementById(s).classList.add('hidden');
  });
  document.getElementById(id).classList.remove('hidden');
}

function irInicio(anon){
  nombre=anon?'Anonimo':(document.getElementById('nombre-inp').value.trim()||'Anonimo');
  showScreen('s-inicio');
}

function setModo(m,btn){
  modo=m;
  document.getElementById('mb-min').classList.remove('activo');
  document.getElementById('mb-may').classList.remove('activo');
  btn.classList.add('activo');
}

// &#9472;&#9472; SELECTOR &#9472;&#9472;
function abrirSelector(){
  var lista=modo==='min'?LETRAS_MIN:LETRAS_MAY;
  var fam=modo==='min'?'Playwrite HR Lijeva':'Playwrite DE Grund';
  var g=document.getElementById('letras-grid');
  g.innerHTML='';
  lista.forEach(function(l){
    var d=document.createElement('div');
    d.className='letra-pick'+(hechas.indexOf(l)>=0?' hecha':'');
    d.textContent=l;
    d.style.fontFamily="'"+fam+"',cursive";
    d.style.fontWeight='300';
    d.onclick=function(){elegirLetra(l);};
    g.appendChild(d);
  });
  document.getElementById('letras-ov').classList.add('show');
}
function cerrarSelector(){document.getElementById('letras-ov').classList.remove('show');}

function elegirLetra(l){
  cerrarSelector();
  letraActual=l; actIdx=0; registro=[]; compIdx=0; compAc=0; t0=new Date();
  showScreen('s-juego');
  actualizarHeader();
  renderAct();
}

// &#9472;&#9472; HEADER &#9472;&#9472;
function actualizarHeader(){
  var fam=modo==='min'?'Playwrite HR Lijeva':'Playwrite DE Grund';
  var hdr=document.getElementById('hdr-letra');
  hdr.textContent=letraActual;
  hdr.style.fontFamily="'"+fam+"',cursive";
  document.getElementById('hdr-nombre').textContent=nombre;
  var noms=['&#9999;&#65039; Trazar','&#9679; Rellenar','&#55357;&#56589; Buscar','&#55357;&#56541; Completar'];
  document.getElementById('hdr-act').innerHTML=noms[actIdx]||'&#9989; Lista';
  var dots=document.getElementById('hdr-dots').children;
  for(var i=0;i<dots.length;i++){
    dots[i].className='hdr-dot';
    if(i<actIdx) dots[i].classList.add('done');
    else if(i===actIdx) dots[i].classList.add('activo');
    else dots[i].classList.add('idle');
  }
}

function sigAct(){
  actIdx++;
  if(actIdx>=4){
    if(hechas.indexOf(letraActual)<0) hechas.push(letraActual);
    actualizarHeader();
    renderFin();
    enviarSheet('fin');
  } else {
    actualizarHeader();
    renderAct();
  }
}
function renderAct(){
  if(actIdx===0) renderTrazo();
  else if(actIdx===1) renderRellenar();
  else if(actIdx===2) renderBuscar();
  else renderCompletar();
}

      var c=document.getElementById(id);
      if(c){c.width=W;c.height=H;}
    });

    var fam=modo==='min'?'Playwrite HR Lijeva':'Playwrite DE Grund';
    var baseline=getBaseline(letraActual,H);
    var guia=document.getElementById('cv-guia').getContext('2d');
    // L&#237;neas de pauta
    guia.strokeStyle='#D8E8FF';guia.lineWidth=1.5;
    guia.beginPath();guia.moveTo(0,H*0.82);guia.lineTo(W,H*0.82);guia.stroke();
    guia.strokeStyle='#FFE0EE';guia.lineWidth=1;guia.setLineDash([5,5]);
    guia.beginPath();guia.moveTo(0,H*0.18);guia.lineTo(W,H*0.18);guia.stroke();
    guia.setLineDash([]);
    // Letra gu&#237;a
    guia.font='300 '+(H*0.72)+'px "'+fam+'",cursive';
    guia.textAlign='center';guia.textBaseline='alphabetic';
    guia.fillStyle='rgba(74,144,217,0.12)';
    guia.strokeStyle='rgba(74,144,217,0.25)';
    guia.lineWidth=10;guia.lineJoin='round';
    guia.strokeText(letraActual,W/2,baseline);
    guia.fillText(letraActual,W/2,baseline);

    // Trazos grabados
    var modoKey=modo==='min'?'min':'may';
    var recorded=TRAZOS[modoKey]&&TRAZOS[modoKey][letraActual];
    var pts=[];
    if(recorded&&recorded.length>2){
      pts=recorded.map(function(p){return{x:p[0]*W,y:p[1]*H};});
    } else {
      var cx=W/2,cy=baseline-(H*0.72)*0.35,r=(H*0.72)*0.3;
      for(var i=0;i<=60;i++){var a=-Math.PI/2+Math.PI*2*i/60;pts.push({x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)});}
    }

    // Punto inicio
    if(pts.length>0){
      guia.beginPath();guia.arc(pts[0].x,pts[0].y,W*0.03,0,Math.PI*2);
      guia.fillStyle='rgba(74,144,217,0.5)';guia.fill();
    }

    // Interacci&#243;n
    var tCv=document.getElementById('cv-trazo');
    var lCv=document.getElementById('cv-lapiz');
    var tc=tCv.getContext('2d');
    var lc=lCv.getContext('2d');
    var painting=false,lastX=0,lastY=0,curX=0,curY=0;
    trazoT=0;

    if(pts.length>0) drawLapiz(lc,pts[0].x,pts[0].y,W);

    function getXY(e){
      var r=lCv.getBoundingClientRect();
      var src=e.touches?e.touches[0]:e;
      return{x:(src.clientX-r.left)*(W/r.width),y:(src.clientY-r.top)*(H/r.height)};
    }
    lCv.addEventListener('touchstart',function(e){e.preventDefault();painting=true;var p=getXY(e);lastX=p.x;lastY=p.y;curX=p.x;curY=p.y;trazoPainted=true;},{passive:false});
    lCv.addEventListener('touchmove',function(e){e.preventDefault();if(!painting)return;var p=getXY(e);tc.beginPath();tc.lineWidth=Math.max(W*0.05,14);tc.lineCap='round';tc.lineJoin='round';tc.strokeStyle='rgba(74,144,217,0.8)';tc.moveTo(lastX,lastY);tc.lineTo(p.x,p.y);tc.stroke();lastX=p.x;lastY=p.y;curX=p.x;curY=p.y;},{passive:false});
    lCv.addEventListener('touchend',function(){painting=false;});
    lCv.addEventListener('mousedown',function(e){painting=true;var p=getXY(e);lastX=p.x;lastY=p.y;curX=p.x;curY=p.y;trazoPainted=true;});
    lCv.addEventListener('mousemove',function(e){if(!painting)return;var p=getXY(e);tc.beginPath();tc.lineWidth=Math.max(W*0.05,14);tc.lineCap='round';tc.lineJoin='round';tc.strokeStyle='rgba(74,144,217,0.8)';tc.moveTo(lastX,lastY);tc.lineTo(p.x,p.y);tc.stroke();lastX=p.x;lastY=p.y;curX=p.x;curY=p.y;});
    lCv.addEventListener('mouseup',function(){painting=false;});

    if(trazoAnim){cancelAnimationFrame(trazoAnim);trazoAnim=null;}
    var SPEED=1/(pts.length*8),UMBRAL=W*0.15;
    function dist(ax,ay,bx,by){var dx=ax-bx,dy=ay-by;return Math.sqrt(dx*dx+dy*dy);}
    function stepLapiz(){
      if(!document.getElementById('trazo-wrap')){trazoAnim=null;return;}
      if(painting&&pts.length>1){
        var idx=Math.floor(trazoT*(pts.length-1));
        var lp=pts[Math.min(idx,pts.length-1)];
        if(dist(curX,curY,lp.x,lp.y)<UMBRAL) trazoT=Math.min(1,trazoT+SPEED);
        var ni=Math.floor(trazoT*(pts.length-1));
        drawLapiz(lc,pts[Math.min(ni,pts.length-1)].x,pts[Math.min(ni,pts.length-1)].y,W);
      }
      trazoAnim=requestAnimationFrame(stepLapiz);
    }
    trazoAnim=requestAnimationFrame(stepLapiz);
  });
}

function drawLapiz(lc,x,y,W){
  lc.clearRect(0,0,lc.canvas.width,lc.canvas.height);
  var R=W*0.055;
  lc.beginPath();lc.arc(x,y,R,0,Math.PI*2);
  lc.fillStyle='rgba(180,200,228,0.92)';lc.fill();
  lc.beginPath();lc.moveTo(x+R*0.2,y+R*0.55);lc.lineTo(x+R*1.1,y+R*1.45);lc.lineTo(x+R*0.8,y-R*0.15);
  lc.closePath();lc.fillStyle='#FF9800';lc.fill();
}
function borrarTrazo(){
  var tc=document.getElementById('cv-trazo');
  if(tc)tc.getContext('2d').clearRect(0,0,tc.width,tc.height);
  trazoPainted=false;trazoT=0;
}
function termTrazo(){
  if(!trazoPainted){notif('&#9757; &#161;Traza la letra primero!');return;}
  if(trazoAnim){cancelAnimationFrame(trazoAnim);trazoAnim=null;}
  registro.push({a:'Trazar',ok:true});
  confetti(20);notif('&#161;Muy bien! &#11088;');
  setTimeout(sigAct,900);
}

// ACTIVIDAD 2: RELLENAR
// &#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;
function renderRellenar(){
  var area=document.getElementById('act-area');
  area.innerHTML='<div class="card">'
    +'<div class="act-tit">&#11044; Rellena los c&#237;rculos<span class="badge">Actividad 2/4</span></div>'
    +'<p class="rel-info">Toca cada c&#237;rculo para pintar la letra</p>'
    +'<div class="dots-wrap" id="dots-wrap">'
    +'<canvas id="cv-letra-r"></canvas>'
    +'<canvas id="cv-dots"></canvas>'
    +'</div>'
    +'<p class="rel-info" id="rel-info"></p>'
    +'<button class="btn-verde" onclick="termRellenar()">&#161;Listo! &#10003;</button>'
    +'</div>';

  dotsOn=[];
  requestAnimationFrame(function(){
    var wrap=document.getElementById('dots-wrap');
    if(!wrap) return;
    var W=wrap.offsetWidth,H=wrap.offsetHeight;
    if(!W||!H){W=260;H=260;}
    ['cv-letra-r','cv-dots'].forEach(function(id){
      var c=document.getElementById(id);if(c){c.width=W;c.height=H;}
    });

    var fam=modo==='min'?'Playwrite HR Lijeva':'Playwrite DE Grund';
    var baseline=getBaseline(letraActual,H);
    var lctx=document.getElementById('cv-letra-r').getContext('2d');
    lctx.font='300 '+(H*0.72)+'px "'+fam+'",cursive';
    lctx.textAlign='center';lctx.textBaseline='alphabetic';
    lctx.fillStyle='rgba(74,144,217,0.12)';
    lctx.strokeStyle='rgba(74,144,217,0.25)';
    lctx.lineWidth=10;lctx.lineJoin='round';
    lctx.strokeText(letraActual,W/2,baseline);
    lctx.fillText(letraActual,W/2,baseline);

    var modoKey=modo==='min'?'min':'may';
    var pts=(DOTS[modoKey]&&DOTS[modoKey][letraActual])||[];
    renderDots(W,H,pts);
    document.getElementById('rel-info').innerHTML='0 / '+pts.length+' c&#237;rculos';

    // Toque
    var dcv=document.getElementById('cv-dots');
    function handleTap(e){
      e.preventDefault();
      var r=dcv.getBoundingClientRect();
      var src=e.touches?e.touches[0]:e;
      var x=(src.clientX-r.left)*(W/r.width),y=(src.clientY-r.top)*(H/r.height);
      var R=Math.max(W*0.044,12),closest=-1,closestD=R*2.2*R*2.2;
      pts.forEach(function(p,i){var dx=p[0]*W-x,dy=p[1]*H-y,d2=dx*dx+dy*dy;if(d2<closestD){closestD=d2;closest=i;}});
      if(closest>=0){
        var idx=dotsOn.indexOf(closest);
        if(idx>=0)dotsOn.splice(idx,1);else dotsOn.push(closest);
      }
      renderDots(W,H,pts);
      document.getElementById('rel-info').innerHTML=dotsOn.length+' / '+pts.length+' c&#237;rculos';
      if(dotsOn.length===pts.length&&pts.length>0) notif('&#127881; &#161;Todos rellenos!');
    }
    dcv.addEventListener('touchstart',handleTap,{passive:false});
    dcv.addEventListener('click',handleTap);
  });
}

function renderDots(W,H,pts){
  var dcv=document.getElementById('cv-dots');
  if(!dcv)return;
  var ctx=dcv.getContext('2d');
  ctx.clearRect(0,0,W,H);
  var R=Math.max(W*0.044,12);
  pts.forEach(function(p,i){
    var x=p[0]*W,y=p[1]*H,lleno=dotsOn.indexOf(i)>=0;
    ctx.beginPath();ctx.arc(x,y,R,0,Math.PI*2);
    ctx.fillStyle=lleno?'#4A90D9':'rgba(200,222,255,0.9)';
    ctx.strokeStyle=lleno?'white':'#A8C8FF';
    ctx.lineWidth=2;ctx.fill();ctx.stroke();
  });
}

function termRellenar(){
  var wrap=document.getElementById('dots-wrap');
  var W=wrap?wrap.offsetWidth:260,H=wrap?wrap.offsetHeight:260;
  var modoKey=modo==='min'?'min':'may';
  var pts=(DOTS[modoKey]&&DOTS[modoKey][letraActual])||[];
  var pct=pts.length>0?Math.round(dotsOn.length/pts.length*100):100;
  registro.push({a:'Rellenar',ok:pct>=40,pct:pct});
  confetti(16);notif('&#161;Genial! &#11088;');
  setTimeout(sigAct,900);
}

// ACTIVIDAD 3: BUSCAR

function renderBuscar(){

function tapBuscar(idx){

  if(cel.dataset.l===letraActual){
    cel.classList.add('ok');bEnc++;
    document.getElementById('bprog').textContent='Encontradas: '+bEnc+' / '+bTotal;

      registro.push({a:'Buscar',ok:true});

    cel.classList.add('err');

// ACTIVIDAD 4: COMPLETAR

function renderCompletar(){compIdx=0;compAc=0;mostrarPalabra();}

function letraKey(l){
  var code=l.charCodeAt(0);
  return code>127?'&#'+code+';':l;
}

function mostrarPalabra(){
  var key=letraKey(letraActual);
  var pals=PALABRAS[key]||[];
  if(compIdx>=pals.length){
    registro.push({a:'Completar',ok:true,ac:compAc,tot:pals.length});
    confetti(28);notif('&#161;Completado! &#11088;&#11088;');
    setTimeout(sigAct,1200);return;
  }
  var item=pals[compIdx];
  compFam=modo==='min'?'Playwrite HR Lijeva':'Playwrite DE Grund';
  var w=item.w,total=pals.length;
  var partes=w.split('_');
  var palabraHTML='';
  if(partes[0]) palabraHTML+='<span class="letra-ok" style="font-family:'+compFam+',cursive;font-weight:300">'+partes[0]+'</span>';
  palabraHTML+='<span class="hueco" id="hueco">?</span>';
  if(partes[1]) palabraHTML+='<span class="letra-ok" style="font-family:'+compFam+',cursive;font-weight:300">'+partes[1]+'</span>';

  var letCorr=modo==='min'?letraActual.toLowerCase():letraActual.toUpperCase();
  var todos=modo==='min'?LETRAS_MIN:LETRAS_MAY;
  var otros=todos.filter(function(l){return l!==letCorr;});
  shuffle(otros);
  var ops=[letCorr,otros[0],otros[1]];shuffle(ops);
  var opsHTML=ops.map(function(o,i){
    return '<div class="letra-op" id="op'+i+'" data-l="'+o+'" style="font-family:'+compFam+',cursive;font-weight:300" onclick="elegirComp('+i+')">'+o+'</div>';
  }).join('');

  document.getElementById('act-area').innerHTML='<div class="card">'
    +'<div class="act-tit">&#128221; Completa la palabra<span class="badge">Actividad 4/4</span></div>'
    +'<p class="comp-prog">'+(compIdx+1)+' / '+total+'</p>'
    +'<div class="comp-tarjeta">'
    +'<span class="comp-emoji">'+item.e+'</span>'
    +'<div class="comp-palabra">'+palabraHTML+'</div>'
    +'</div>'
    +'<div class="comp-ops">'+opsHTML+'</div>'
    +'<div id="comp-estado"></div>'
    +'<button class="btn-sig-comp" id="btn-sig-comp" onclick="sigPalabra()">Siguiente &#8594;</button>'
    +'<p class="msg-sig-comp" id="msg-sig-comp">&#9997;&#65039; Antes de pasar, intenta escribirla</p>'
    +'</div>';
}

function elegirComp(i){
  var op=document.getElementById('op'+i);
  if(!op||op.classList.contains('disabled'))return;
  var elegida=op.dataset.l;
  var letCorr=modo==='min'?letraActual.toLowerCase():letraActual.toUpperCase();
  var hueco=document.getElementById('hueco');
  [0,1,2].forEach(function(j){var e=document.getElementById('op'+j);if(e)e.classList.add('disabled');});
  if(elegida===letCorr){
    hueco.innerHTML='<span style="font-family:'+compFam+',cursive;font-weight:300;font-size:1.6rem">'+elegida+'</span>';
    hueco.classList.add('correcto');
    compAc++;
    document.getElementById('comp-estado').innerHTML='&#10003; &#161;Correcto!';
    document.getElementById('btn-sig-comp').style.display='block';
    document.getElementById('msg-sig-comp').style.display='block';
  } else {
    hueco.classList.add('error');
    op.style.background='#FFF0EE';op.style.borderColor='#E74C3C';
    document.getElementById('comp-estado').innerHTML='&#10008; &#161;Intentalo de nuevo!';
    setTimeout(function(){
      hueco.classList.remove('error');
      [0,1,2].forEach(function(j){var e=document.getElementById('op'+j);if(e){e.classList.remove('disabled');e.style.background='';e.style.borderColor='';}});
      document.getElementById('comp-estado').innerHTML='';
    },700);
  }
}

function sigPalabra(){compIdx++;mostrarPalabra();}

// &#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;
// UTILIDADES
// &#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;
function getBaseline(l,H){
  var map={'f':H*0.68,'g':H*0.65,'j':H*0.62,'p':H*0.65,'q':H*0.65,'y':H*0.65,'\u00f1':H*0.72,'\u00d1':H*0.84};
  return map[l]||H*0.78;
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=~~(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

// &#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;
// LOCK PARENTAL
// &#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;
function genOp(){
  var r=~~(Math.random()*3);
  if(r===0){var a=1+~~(Math.random()*10),b=1+~~(Math.random()*10);return{t:a+' + '+b+' = ?',r:a+b};}
  if(r===1){var a=6+~~(Math.random()*9),b=1+~~(Math.random()*5);return{t:a+' - '+b+' = ?',r:a-b};}
  var a=2+~~(Math.random()*5),b=2+~~(Math.random()*5);return{t:a+' x '+b+' = ?',r:a*b};
}
function pedirLock(desc,cb,cancel){
  var op=genOp();lockResp=op.r;lockCb=cb;
  document.getElementById('lock-desc').textContent=desc;
  document.getElementById('lock-math').textContent=op.t;
  document.getElementById('lock-inp').value='';
  document.getElementById('lock-err').textContent='';
  document.getElementById('lock-cancel').style.display=(cancel!==false)?'block':'none';
  document.getElementById('lock-ov').classList.add('show');
  setTimeout(function(){document.getElementById('lock-inp').focus();},150);
}
function checkLock(){
  var v=parseInt(document.getElementById('lock-inp').value,10);
  if(v===lockResp){
    document.getElementById('lock-ov').classList.remove('show');
    if(lockCb)lockCb();
  } else {
    document.getElementById('lock-err').textContent='&#10060; Incorrecto';
    document.getElementById('lock-inp').value='';
  }
}
function hideLock(){document.getElementById('lock-ov').classList.remove('show');}
function pedirSalir(){
  pedirLock('Resuelve para volver al inicio:',function(){
    if(trazoAnim){cancelAnimationFrame(trazoAnim);trazoAnim=null;}
    enviarSheet('manual');showScreen('s-inicio');
  });
}
function entrarFS(){
  var el=document.documentElement;
  if(el.requestFullscreen)el.requestFullscreen();
  else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
}
function onFSC(){
  var en=!!(document.fullscreenElement||document.webkitFullscreenElement);
  if(!en&&!document.getElementById('s-juego').classList.contains('hidden')){
    pedirLock('Resuelve para volver a pantalla completa:',function(){entrarFS();},false);
  }
}
document.addEventListener('fullscreenchange',onFSC);
document.addEventListener('webkitfullscreenchange',onFSC);
document.addEventListener('keydown',function(e){
  if(document.getElementById('lock-ov').classList.contains('show')&&e.key==='Escape'){
    e.preventDefault();e.stopPropagation();
  }
},true);
history.pushState(null,'',location.href);
window.addEventListener('popstate',function(){history.pushState(null,'',location.href);});

var nTimer=null;
function notif(txt){
  var n=document.getElementById('notif');
  n.innerHTML=txt;n.classList.add('show');
  clearTimeout(nTimer);nTimer=setTimeout(function(){n.classList.remove('show');},2200);
}
function confetti(c){
  var cont=document.getElementById('cc');
  var cols=['#4A90D9','#FFD93D','#FF8FAB','#27AE60','#FF9F43','#9C27B0'];
  for(var i=0;i<(c||20);i++){
    var p=document.createElement('div');p.className='cp';
    var col=cols[~~(Math.random()*cols.length)];
    var w=6+Math.random()*8;
    p.style.cssText='left:'+Math.random()*100+'%;background:'+col
      +';width:'+w+'px;height:'+w+'px'
      +';animation-duration:'+(1.5+Math.random()*2)+'s'
      +';animation-delay:'+Math.random()*.5+'s'
      +';border-radius:'+(Math.random()>.5?'50%':'2px')+';';
    cont.appendChild(p);
    p.addEventListener('animationend',function(){if(this.parentNode)this.parentNode.removeChild(this);});
  }
}

function enviarSheet(motivo){
  if(nombre==='Anonimo')return;
  var dur=t0?Math.round((new Date()-t0)/1000):0;
  fetch(SHEET,{method:'POST',
    body:JSON.stringify({
      Nombre:nombre,
      Actividad:'Letras - '+letraActual+' - '+modo,
      Aciertos:registro.filter(function(r){return r.ok;}).length,
      Errores:0,Puntos:hechas.length*4,
      PalabrasFalladas:registro.map(function(r){return r.a+':'+(r.ok?'OK':'FALLO');}).join(' | ')
        +(motivo!=='fin'?' (incompleto)':'')
    }),
    headers:{'Content-Type':'application/json'}
  }).catch(function(){});
}

function descargar(){
  var now=new Date();

  var filas=registro.map(function(r){

      +'<td style="padding:8px 12px">'+(r.pct!==undefined?r.pct+'%':r.ac!==undefined?r.ac+'/'+r.tot:'-')+'</td></tr>';
  }).join('');
  var htm='<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Informe</title>'
    +'<style>body{font-family:system-ui,sans-serif;background:#F0F7FF;padding:2rem}'
    +'h1{color:#1E5FA8;margin-bottom:.5rem}'
    +'.chips{display:flex;gap:.8rem;flex-wrap:wrap;margin:1rem 0 1.5rem}'
    +'.chip{background:white;border-radius:12px;padding:.4rem 1rem;font-size:.9rem;font-weight:700;border:2px solid #C8DEFF}'
    +'.chip span{color:#4A90D9}'
    +'table{width:100%;border-collapse:collapse;background:white;border-radius:12px;overflow:hidden}'
    +'th{background:linear-gradient(135deg,#4A90D9,#1E5FA8);color:white;padding:10px 12px;text-align:left}'
    +'td{border-bottom:1px solid #E8F3FF;font-size:.88rem}'
    +'</style></head><body>'
    +'<h1>&#9999;&#65039; La Letra &#8212; Informe</h1>'
    +'<p style="color:#4A90D9;font-weight:600">Alumno/a: <strong>'+nombre+'</strong> &bull; '
    +now.toLocaleDateString('es-ES',{weekday:'long',year:'numeric',month:'long',day:'numeric'})+'</p>'
    +'<div class="chips">'
    +'<div class="chip">Letra: <span>'+letraActual+'</span></div>'
    +'<div class="chip">Modo: <span>'+(modo==='min'?'Min&#250;sculas':'May&#250;sculas')+'</span></div>'
    +'<div class="chip">Letras hechas: <span>'+hechas.length+'</span></div>'
    +'<div class="chip">Tiempo: <span>'+Math.floor(dur/60)+'m '+dur%60+'s</span></div>'
    +'</div>'
    +'<table><thead><tr><th>Actividad</th><th>Resultado</th><th>Detalle</th></tr></thead>'
    +'<tbody>'+(filas||'<tr><td colspan="3" style="padding:1rem;text-align:center;color:#999">Sin datos</td></tr>')+'</tbody></table>'
    +'</body></html>';
  var blob=new Blob([htm],{type:'text/html;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='informe_letras_'+nombre+'_'+now.toISOString().slice(0,10)+'.html';
  a.click();
}
