<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Letra Inicial vs Letra Final - EdTech</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+DE+Grund:wght@100..400&family=Playwrite+HR+Lijeva:wght@100..400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --verde: #4CAF50; --azul: #4FC3F7; --rojo: #FF5252; --fondo: #FDFEFE;
            --pastel-azul: #E1F5FE; --pastel-rosa: #FCE4EC; --pastel-amarillo: #FFF9C4;
            --text-color: #34495E;
            --font-mayus: 'Playwrite DE Grund', sans-serif;
            --font-minus: 'Playwrite HR Lijeva', cursive;
        }

        body {
            background-color: var(--fondo);
            text-align: center; margin: 0; padding: 0;
            user-select: none; overflow: hidden;
            display: flex; flex-direction: column; height: 100vh; width: 100vw;
        }

        .case-mayus { font-family: var(--font-mayus); text-transform: uppercase; }
        .case-minus { font-family: var(--font-minus); text-transform: lowercase; }

        /* Pantalla de Inicio Decorada */
        #start-screen {
            position: fixed; inset: 0; z-index: 2000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: radial-gradient(circle, #ffffff 0%, #f0f7ff 100%);
            overflow: hidden;
        }

        .floating-letter {
            position: absolute; font-family: var(--font-mayus); font-weight: bold;
            font-size: 2.5rem; opacity: 0.15; z-index: 1; animation: float 12s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(110vh) rotate(0deg); }
            100% { transform: translateY(-10vh) rotate(360deg); }
        }

        #start-content {
            position: relative; z-index: 10; background: rgba(255, 255, 255, 0.9);
            padding: 40px; border-radius: 50px; box-shadow: 0 20px 45px rgba(0,0,0,0.06);
            border: 6px solid white; max-width: 85%;
        }

        .title-main { font-size: 2.5rem; color: #455A64; margin: 0 0 10px 0; }

        .selector-box {
            background: var(--pastel-azul); padding: 20px; border-radius: 35px; 
            margin: 20px 0; border: 3px dashed #B3E5FC;
        }

        .btn-main {
            padding: 15px 40px; font-size: 1.5rem; background: var(--verde);
            color: white; border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 6px 0 #388E3C; transition: all 0.2s; font-weight: bold;
        }
        .btn-main:active { transform: translateY(3px); box-shadow: 0 3px 0 #388E3C; }

        /* Estructura del Juego */
        #game-container {
            display: none; flex: 1; flex-direction: column; padding: 10px;
            max-width: 1100px; margin: auto; width: 100%; box-sizing: border-box; z-index: 5;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            background: white; padding: 10px 20px; border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04); margin-bottom: 5px;
        }

        .header-btn {
            background: #f0f0f0; border: none; padding: 10px; border-radius: 15px;
            cursor: pointer; font-size: 1.5rem; transition: 0.2s;
        }
        .header-btn:hover { background: #e0e0e0; }

        #instruction-box {
            background: white; padding: 20px; border-radius: 35px;
            margin: 10px 0; border: 5px solid var(--azul);
        }

        #grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px; overflow-y: auto; padding: 10px; flex: 1;
        }

        .card {
            background: white; border: 4px solid #F8F9F9; border-radius: 35px;
            padding: 15px; cursor: pointer; transition: 0.3s;
        }
        .card:hover { border-color: var(--azul); transform: scale(1.02); }
        .card .emoji { font-size: 70px; display: block; }
        .card p { font-size: 1.4rem; margin: 5px 0; color: var(--text-color); }
        .card.correct { border-color: var(--verde); background: #F1F8E9; }

        /* Modales */
        #parental-modal, #overlay {
            position: fixed; inset: 0; z-index: 5000; display: none;
            flex-direction: column; justify-content: center; align-items: center;
            background: rgba(255,255,255,0.95); padding: 20px; backdrop-filter: blur(5px);
        }

        .exit-timer-btn {
            width: 180px; height: 180px; border-radius: 50%; border: 8px solid #f5f5f5;
            background: var(--rojo); color: white; font-size: 1rem; cursor: pointer;
            position: relative; overflow: hidden; margin-top: 20px;
        }
        #progress-fill { position: absolute; bottom: 0; width: 100%; background: rgba(255,255,255,0.4); height: 0%; }

        #btn-parental-access {
            position: fixed; top: 15px; right: 15px; background: white;
            border: 2px solid #eee; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; z-index: 3000;
        }
    </style>
</head>
<body class="case-mayus" id="main-body">

<button id="btn-parental-access" onclick="showParental('settings')">⚙️</button>

<div id="start-screen">
    <div id="start-content">
        <h1 class="title-main">Letra Inicial vs Letra Final</h1>
        <div class="selector-box">
            <button class="btn-main" style="background: #4FC3F7; box-shadow: 0 5px 0 #039BE5;" id="toggleCase" onclick="switchCase()">MAYÚSCULAS</button>
        </div>
        <button class="btn-main" onclick="startGame()">¡A JUGAR!</button>
    </div>
</div>

<div id="game-container">
    <div class="header">
        <button class="header-btn" onclick="showParental('home')">🏠</button>
        <div style="font-weight: bold; color: #607D8B;">NIVEL: <span id="lvl">1</span></div>
        <button class="btn-main" style="font-size: 0.8rem; padding: 8px 15px; background: #78909C; box-shadow: 0 3px 0 #455A64;" onclick="downloadReport()">📥 INFORME</button>
        <div style="font-weight: bold; color: #607D8B;">PRUEBA: <span id="trial">1</span>/10</div>
    </div>

    <div id="instruction-box">
        <div id="instruction-text" style="font-size: 1.8rem; color: #2C3E50;">CARGANDO...</div>
        <button style="background:var(--azul); color:white; padding:10px 25px; border-radius:50px; border:none; cursor:pointer; margin-top:10px; font-weight:bold;" onclick="repetirAudio()">🔊 OÍR DE NUEVO</button>
    </div>

    <div id="grid"></div>
</div>

<div id="overlay">
    <div style="text-align:center;">
        <div style="font-size: 5rem;">💡</div>
        <h2 style="color:#607D8B;">¡Sigue intentándolo!</h2>
        <button class="btn-main" onclick="cerrarError()">CONTINUAR</button>
    </div>
</div>

<div id="parental-modal">
    <h2 style="font-family: sans-serif; color: #455A64;">ZONA DE ADULTOS</h2>
    <p id="math-q" style="font-size: 1.5rem; font-family: sans-serif; color: #039BE5; font-weight: bold;"></p>
    <input type="number" id="math-a" placeholder="?" style="font-size: 2rem; width: 100px; text-align: center; border: 4px solid var(--azul); border-radius: 15px; margin-bottom: 20px;">
    
    <div id="parental-actions">
        <button id="exit-confirm-btn" class="btn-main" style="display:none;" onclick="checkHomeReturn()">VOLVER AL MENÚ</button>
        
        <button id="exit-hold-btn" class="exit-timer-btn" style="display:none;">
            <div id="progress-fill"></div>
            <span style="position:relative; z-index:2; font-family: sans-serif; font-weight: bold;">MANTÉN 3s<br>PARA SALIR</span>
        </button>
    </div>
    
    <button onclick="hideParental()" style="margin-top:30px; color: #B0BEC5; background:none; border:none; text-decoration:underline; cursor:pointer; font-family: sans-serif;">CANCELAR</button>
</div>

<script>
    const db = [
        { n: "AVIÓN", i: "A", f: "N", e: "✈️" }, { n: "BOLA", i: "B", f: "A", e: "⚽" },
        { n: "CASA", i: "C", f: "A", e: "🏠" }, { n: "DADO", i: "D", f: "O", e: "🎲" },
        { n: "ELEFANTE", i: "E", f: "E", e: "🐘" }, { n: "FRESA", i: "F", f: "A", e: "🍓" },
        { n: "GATO", i: "G", f: "O", e: "🐱" }, { n: "HELADO", i: "H", f: "O", e: "🍦" },
        { n: "ISLA", i: "I", f: "A", e: "🏝️" }, { n: "JABÓN", i: "J", f: "N", e: "🧼" },
        { n: "LUNA", i: "L", f: "A", e: "🌙" }, { n: "MANO", i: "M", f: "O", e: "✋" },
        { n: "NUBE", i: "N", f: "E", e: "☁️" }, { n: "OJO", i: "O", f: "O", e: "👁️" },
        { n: "PATO", i: "P", f: "O", e: "🦆" }, { n: "QUESO", i: "Q", f: "O", e: "🧀" },
        { n: "RATÓN", i: "R", f: "N", e: "🐭" }, { n: "SOL", i: "S", f: "L", e: "☀️" },
        { n: "TREN", i: "T", f: "N", e: "🚂" }, { n: "UVA", i: "U", f: "A", e: "🍇" }
    ];

    let nivel = 1, prueba = 1, correcta = null, modo = "inicial", bloqueado = false;
    let logs = [];
    let isMayus = true, parentalMode = ""; 
    let exitInterval, exitProgress = 0, mathRes = 0;

    function createBackground() {
        const screen = document.getElementById('start-screen');
        const letters = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ";
        for(let i=0; i<25; i++) {
            const span = document.createElement('span');
            span.className = 'floating-letter';
            span.innerText = letters[Math.floor(Math.random() * letters.length)];
            span.style.left = Math.random() * 100 + "vw";
            span.style.animationDelay = Math.random() * 12 + "s";
            span.style.color = `hsl(${Math.random() * 360}, 70%, 80%)`;
            screen.appendChild(span);
        }
    }
    createBackground();

    function switchCase() {
        isMayus = !isMayus;
        document.getElementById('toggleCase').innerText = isMayus ? "MAYÚSCULAS" : "minúsculas";
        document.getElementById('main-body').className = isMayus ? "case-mayus" : "case-minus";
    }

    function startGame() {
        if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('game-container').style.display = 'flex';
        iniciarPrueba();
    }

    function iniciarPrueba() {
        bloqueado = false;
        const grid = document.getElementById('grid');
        grid.innerHTML = "";
        modo = Math.random() > 0.5 ? "inicial" : "final";
        correcta = db[Math.floor(Math.random() * db.length)];
        const letraObjetivo = modo === "inicial" ? correcta.i : correcta.f;
        let distractores = db.filter(p => (modo === "inicial" ? p.i : p.f) !== letraObjetivo)
                             .sort(() => 0.5 - Math.random()).slice(0, Math.min(nivel + 1, 6));
        let opciones = [...distractores, correcta].sort(() => 0.5 - Math.random());

        opciones.forEach(p => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<span class="emoji">${p.e}</span><p>${p.n}</p>`;
            card.onclick = () => verificar(p, card);
            grid.appendChild(card);
        });
        actualizarInterfaz();
    }

    function actualizarInterfaz() {
        const letra = modo === "inicial" ? correcta.i : correcta.f;
        const tipo = modo === "inicial" ? "EMPIEZA" : "TERMINA";
        const texto = `¿QUÉ PALABRA ${tipo} POR LA LETRA ${letra}?`;
        document.getElementById('instruction-text').innerText = texto;
        document.getElementById('lvl').innerText = nivel;
        document.getElementById('trial').innerText = prueba;
        decir(texto);
    }

    function decir(t) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t.toLowerCase());
        m.lang = 'es-ES'; m.rate = 0.9;
        window.speechSynthesis.speak(m);
    }

    function repetirAudio() {
        const letra = modo === "inicial" ? correcta.i : correcta.f;
        const tipo = modo === "inicial" ? "empieza" : "termina";
        decir(`Busca la que ${tipo} por la letra... ${letra}`);
    }

    function verificar(p, el) {
        if(bloqueado) return;
        const esCorrecta = p.n === correcta.n;
        const timestamp = new Date().toLocaleTimeString();
        if(esCorrecta) {
            bloqueado = true;
            el.classList.add('correct');
            logs.push({ h: timestamp, r: "ACIERTO", m: modo, obj: correcta.n, sel: p.n, l: nivel });
            sonar(600, 1000);
            setTimeout(() => {
                prueba++;
                if(prueba > 10) { nivel++; prueba = 1; }
                iniciarPrueba();
            }, 1500);
        } else {
            bloqueado = true;
            logs.push({ h: timestamp, r: "FALLO", m: modo, obj: correcta.n, sel: p.n, l: nivel });
            sonar(200, 100);
            document.getElementById('overlay').style.display = 'flex';
        }
    }

    function sonar(f1, f2) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.frequency.setValueAtTime(f1, ctx.currentTime);
            o.frequency.exponentialRampToValueAtTime(f2, ctx.currentTime + 0.2);
            g.gain.setValueAtTime(0.1, ctx.currentTime);
            o.start(); o.stop(ctx.currentTime + 0.3);
        } catch(e) {}
    }

    function cerrarError() {
        document.getElementById('overlay').style.display = 'none';
        bloqueado = false;
        repetirAudio();
    }

    // CONTROL PARENTAL MULTIFUNCIÓN
    function showParental(target) {
        parentalMode = target;
        const n1 = Math.floor(Math.random() * 7) + 2;
        const n2 = Math.floor(Math.random() * 5) + 1;
        mathRes = n1 + n2;
        document.getElementById('math-q').innerText = `SUMA: ${n1} + ${n2}`;
        document.getElementById('math-a').value = "";
        document.getElementById('parental-modal').style.display = 'flex';
        
        // Mostrar botón según objetivo
        document.getElementById('exit-confirm-btn').style.display = (target === 'home') ? 'block' : 'none';
        document.getElementById('exit-hold-btn').style.display = (target === 'settings') ? 'block' : 'none';
    }

    function hideParental() { 
        document.getElementById('parental-modal').style.display = 'none'; 
        exitProgress = 0;
        document.getElementById('progress-fill').style.height = "0%";
    }

    function checkHomeReturn() {
        const val = parseInt(document.getElementById('math-a').value);
        if(val === mathRes) {
            document.getElementById('parental-modal').style.display = 'none';
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('start-screen').style.display = 'flex';
            if (document.exitFullscreen) document.exitFullscreen();
        } else {
            alert("Suma incorrecta");
        }
    }

    // Lógica de mantenimiento para salida total
    const exitHoldBtn = document.getElementById('exit-hold-btn');
    function startExitTimer() {
        if(parseInt(document.getElementById('math-a').value) !== mathRes) return;
        exitInterval = setInterval(() => {
            exitProgress += 2;
            document.getElementById('progress-fill').style.height = exitProgress + "%";
            if(exitProgress >= 100) {
                clearInterval(exitInterval);
                location.reload();
            }
        }, 60);
    }
    function stopExitTimer() { clearInterval(exitInterval); exitProgress = 0; document.getElementById('progress-fill').style.height = "0%"; }

    exitHoldBtn.addEventListener('mousedown', startExitTimer);
    exitHoldBtn.addEventListener('touchstart', startExitTimer);
    window.addEventListener('mouseup', stopExitTimer);
    window.addEventListener('touchend', stopExitTimer);

    function downloadReport() {
        if(logs.length === 0) return alert("No hay datos");
        let html = `<html><head><meta charset="utf-8"><style>body{font-family:sans-serif;padding:30px;}table{width:100%;border-collapse:collapse;}th,td{padding:10px;border:1px solid #ddd;}.ACIERTO{color:green;}.FALLO{color:red;}</style></head>
        <body><h1>Informe Letra Inicial vs Final</h1><table><tr><th>Hora</th><th>Nivel</th><th>Objetivo</th><th>Seleccionado</th><th>Resultado</th></tr>
        ${logs.map(l=>`<tr><td>${l.h}</td><td>${l.l}</td><td>${l.obj}</td><td>${l.sel}</td><td class="${l.r}">${l.r}</td></tr>`).join('')}
        </table></body></html>`;
        const blob = new Blob([html], {type:'text/html'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "reporte_fonologia.html";
        a.click();
    }
</script>

</body>
</html>
