<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Salto de la Sílaba - 20 Retos</title>
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+DE+Grund&family=Playwrite+HR+Lijeva&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { 
            --accent: #ff4081; 
            --bg: #f0f4f8; 
            --success: #4caf50; 
            --font-mayus: 'Playwrite DE Grund', sans-serif;
            --font-minus: 'Playwrite HR Lijeva', sans-serif;
        }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background: var(--bg); user-select: none; 
            font-family: var(--font-mayus);
        }
        
        #app { width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        
        /* Fondo letras colores flotantes */
        .bg-letters { position: fixed; inset: 0; z-index: 1; opacity: 0.18; pointer-events: none; }
        .bg-char { position: absolute; font-size: 4rem; font-weight: bold; animation: float 15s infinite linear; }
        @keyframes float { from { transform: translateY(110vh) rotate(0deg); } to { transform: translateY(-10vh) rotate(360deg); } }

        /* Capas de contenido sobre el fondo */
        #menu, #game-content { position: relative; z-index: 10; }

        /* UI */
        .nav { position: absolute; top: 20px; width: 92%; display: flex; justify-content: space-between; z-index: 100; }
        .btn-ui { width: 60px; height: 60px; border-radius: 15px; border: 3px solid white; background: white; cursor: pointer; font-size: 25px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        /* MENU */
        #menu { position: fixed; inset: 0; background: rgba(240, 244, 248, 0.95); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .card { background: white; padding: 40px; border-radius: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); text-align: center; max-width: 500px; }
        .btn-case { padding: 15px 25px; margin: 10px; border: 2px solid #ddd; border-radius: 20px; cursor: pointer; font-family: inherit; font-size: 1.1rem; transition: 0.3s; }
        .btn-case.active { background: var(--accent); color: white; border-color: var(--accent); }

        /* GAME AREA */
        #game-content { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #emoji { font-size: 100px; margin-bottom: 10px; }
        .word-ui { font-size: 4rem; display: flex; align-items: center; gap: 10px; margin-bottom: 40px; }
        .gap { color: var(--accent); border-bottom: 5px solid var(--accent); min-width: 100px; text-align: center; }
        .options { display: flex; gap: 30px; margin-bottom: 30px; }
        .btn-syl { background: white; border: 4px solid var(--accent); padding: 20px 40px; border-radius: 25px; font-size: 3.5rem; cursor: pointer; transition: 0.2s; font-family: inherit; min-width: 160px; }
        
        #btn-next { display: none; padding: 15px 45px; font-size: 1.5rem; background: var(--success); color: white; border: none; border-radius: 50px; cursor: pointer; font-family: inherit; }
        #fs-timer { position: fixed; bottom: 20px; background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px; display: none; z-index: 2000; }
    </style>
</head>
    <div style="position:fixed;bottom:10px;left:12px;z-index:9999;pointer-events:none;background:rgba(42,157,143,0.75);color:white;font-family:sans-serif;font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;letter-spacing:0.03em;">© Creado por Inma Merino Rus</div>
<body>

<div id="app">
    <div class="bg-letters" id="bg"></div>

    <div class="nav">
        <button class="btn-ui" onclick="parental('home')">🏠</button>
        <button class="btn-ui" onmousedown="fsStart()" onmouseup="fsEnd()" ontouchstart="fsStart()" ontouchend="fsEnd()">⛶</button>
        <button class="btn-ui" onclick="getReport()">📋</button>
    </div>

    <div id="menu">
        <div class="card">
            <h1 id="main-title" style="color:var(--accent)">Salto Silábico</h1>
            <p>Selecciona letra:</p>
            <button id="b-may" class="btn-case active" onclick="setL('MAY')">MAYÚSCULAS</button>
            <button id="b-min" class="btn-case" onclick="setL('MIN')">minúsculas</button>
            <br><br>
            <button class="btn-case active" style="background:var(--success); color:white; border:none;" onclick="start()">¡EMPEZAR!</button>
        </div>
    </div>

    <div id="game-content">
        <div id="emoji"></div>
        <div class="word-ui" id="word-box"></div>
        <div class="options" id="opt-box"></div>
        <button id="btn-next" onclick="next()">SIGUIENTE ➔</button>
    </div>

    <div id="fs-timer">Mantén pulsado (3s)... <span id="fs-count">0</span>%</div>
</div>

<script>
    const WORDS = [
        // NIVEL 1 (20)
        { e: '🏰', c: 'as', o: ['as','sa'], w: 'C__TILLO', f: 'CASTILLO' },
        { e: '🐍', c: 'se', o: ['es','se'], w: '__RPIENTE', f: 'SERPIENTE' },
        { e: '🎒', c: 'mo', o: ['om','mo'], w: '__CHILA', f: 'MOCHILA' },
        { e: '🪜', c: 'es', o: ['es','se'], w: '__CALERA', f: 'ESCALERA' },
        { e: '🍊', c: 'na', o: ['an','na'], w: '__RANJA', f: 'NARANJA' },
        { e: '🦒', c: 'ra', o: ['ar','ra'], w: 'JI__FA', f: 'JIRAFA' },
        { e: '🐜', c: 'an', o: ['an','na'], w: '__TENA', f: 'ANTENA' },
        { e: '🌴', c: 'al', o: ['al','la'], w: 'P__MA', f: 'PALMA' },
        { e: '🧤', c: 'gu', o: ['ug','gu'], w: '__ANTE', f: 'GUANTE' },
        { e: '🐀', c: 'ra', o: ['ar','ra'], w: '__TÓN', f: 'RATÓN' },
        { e: '🌲', c: 'ar', o: ['ar','ra'], w: '__BOL', f: 'ÁRBOL' },
        { e: '🍕', c: 'pi', o: ['ip','pi'], w: '__ZZA', f: 'PIZZA' },
        { e: '🧜‍♀️', c: 'si', o: ['is','si'], w: '__RENA', f: 'SIRENA' },
        { e: '🏝️', c: 'is', o: ['is','si'], w: '__LA', f: 'ISLA' },
        { e: '🌙', c: 'lu', o: ['ul','lu'], w: '__NA', f: 'LUNA' },
        { e: '🎯', c: 'ul', o: ['ul','lu'], w: '__TIMO', f: 'ÚLTIMO' },
        { e: '👂', c: 'or', o: ['or','ro'], w: '__EJA', f: 'OREJA' },
        { e: '🌹', c: 'ro', o: ['or','ro'], w: '__SA', f: 'ROSA' },
        { e: '🐘', c: 'el', o: ['el','le'], w: '__EFANTE', f: 'ELEFANTE' },
        { e: '🦁', c: 'le', o: ['el','le'], w: '__ÓN', f: 'LEÓN' },
        // NIVEL 2 (20)
        { e: '👻', c: 'fa', o: ['af','fa'], w: '__NTASMA', f: 'FANTASMA' },
        { e: '🎂', c: 'as', o: ['as','sa'], w: 'P__TEL', f: 'PASTEL' },
        { e: '🌂', c: 'pa', o: ['ap','pa'], w: '__RAGUAS', f: 'PARAGUAS' },
        { e: '🥣', c: 'as', o: ['as','sa'], w: 'P__TA', f: 'PASTA' },
        { e: '🚢', c: 'ba', o: ['ab','ba'], w: '__RCO', f: 'BARCO' },
        { e: '🪣', c: 'cu', o: ['uc','cu'], w: '__BO', f: 'CUBO' },
        { e: '🦟', c: 'mo', o: ['om','mo'], w: '__SQUITO', f: 'MOSQUITO' },
        { e: '🧥', c: 'ab', o: ['ab','ba'], w: '__RIGO', f: 'ABRIGO' },
        { e: '🚪', c: 'pu', o: ['up','pu'], w: '__ERTA', f: 'PUERTA' },
        { e: '🦴', c: 'ue', o: ['eu','ue'], w: 'H__SO', f: 'HUESO' },
        { e: '🦷', c: 'di', o: ['id','di'], w: '__ENTE', f: 'DIENTE' },
        { e: '🚿', c: 'du', o: ['ud','du'], w: '__CHA', f: 'DUCHA' },
        { e: '🧸', c: 'os', o: ['os','so'], w: '__O', f: 'OSO' },
        { e: '🍲', c: 'so', o: ['os','so'], w: '__PA', f: 'SOPA' },
        { e: '🔔', c: 'ca', o: ['ac','ca'], w: '__MPANA', f: 'CAMPANA' },
        { e: '👨‍🍳', c: 'co', o: ['oc','co'], w: '__CINA', f: 'COCINA' },
        { e: '👓', c: 'ga', o: ['ag','ga'], w: '__FAS', f: 'GAFAS' },
        { e: '🐱', c: 'ga', o: ['ag','ga'], w: '__TO', f: 'GATO' },
        { e: '🐆', c: 'ti', o: ['it','ti'], w: '__GRE', f: 'TIGRE' },
        { e: '👟', c: 'te', o: ['et','te'], w: '__NIS', f: 'TENIS' }
    ];

    let currentL = 'MAY', idx = 0, log = [], fsHoldInterval, fsProgress = 0;

    function setL(c) {
        currentL = c;
        document.getElementById('b-may').classList.toggle('active', c==='MAY');
        document.getElementById('b-min').classList.toggle('active', c==='MIN');
        
        const targetFont = c === 'MAY' ? "var(--font-mayus)" : "var(--font-minus)";
        document.body.style.fontFamily = targetFont;
        document.getElementById('main-title').style.fontFamily = targetFont;
    }

    function start() { 
        document.getElementById('menu').style.display='none'; 
        load(); 
    }

    function load() {
        const item = WORDS[idx];
        document.getElementById('emoji').innerText = item.e;
        document.getElementById('btn-next').style.display = 'none';
        const box = document.getElementById('word-box');
        box.innerHTML = "";
        const p = item.w.split("__");
        box.innerHTML = `<span>${fmt(p[0])}</span><span class="gap" id="gap">_ _</span><span>${fmt(p[1]||"")}</span>`;
        
        const opts = document.getElementById('opt-box');
        opts.innerHTML = "";
        item.o.forEach(o => {
            const b = document.createElement('button');
            b.className = 'btn-syl';
            b.innerText = fmt(o);
            b.onclick = () => check(o, b);
            opts.appendChild(b);
        });
        speak(`Completa la palabra ${item.f}`);
    }

    function fmt(t) { return currentL==='MAY' ? t.toUpperCase() : t.toLowerCase(); }

    function check(val, btn) {
        const item = WORDS[idx];
        if(val === item.c) {
            document.getElementById('gap').innerText = fmt(val);
            document.getElementById('gap').style.border = "none";
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            speak("¡Genial!");
            document.getElementById('opt-box').innerHTML = "";
            document.getElementById('btn-next').style.display = 'block';
            log.push({ w: item.f, r: 'Acierto' });
        } else {
            speak("Intenta otra vez");
            btn.style.borderColor = "red";
            log.push({ w: item.f, r: 'Fallo' });
        }
    }

    function next() { idx = (idx + 1) % WORDS.length; load(); }

    function speak(t) { 
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const m = new SpeechSynthesisUtterance(t); 
            m.lang='es-ES'; 
            window.speechSynthesis.speak(m); 
        }
    }

    function parental(a) {
        const n1 = Math.floor(Math.random()*8)+1, n2 = Math.floor(Math.random()*5);
        Swal.fire({ title: 'Control Parental', text: `¿Cuánto es ${n1} + ${n2}?`, input: 'number' }).then(r => {
            if(parseInt(r.value) === (n1+n2) && a === 'home') {
                window.location.reload();
            }
        });
    }

    /* --- SISTEMA ROBUSTO DE PANTALLA COMPLETA --- */
    function toggleFullscreenNatively() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.log(`Error al activar pantalla completa: ${err.message}`);
            });
        } else {
            document.exitFullscreen();
        }
    }

    function fsStart() {
        fsProgress = 0;
        document.getElementById('fs-count').innerText = "0";
        document.getElementById('fs-timer').style.display = 'block';
        
        clearInterval(fsHoldInterval);
        fsHoldInterval = setInterval(() => {
            fsProgress += 10;
            document.getElementById('fs-count').innerText = fsProgress;
            
            if (fsProgress >= 100) {
                clearInterval(fsHoldInterval);
                document.getElementById('fs-timer').style.display = 'none';
                toggleFullscreenNatively();
            }
        }, 300); // 10 iteraciones de 300ms = 3 segundos
    }

    function fsEnd() {
        clearInterval(fsHoldInterval);
        document.getElementById('fs-timer').style.display = 'none';
    }

    function getReport() {
        let h = "<h2>Informe de Progreso - Salto Silábico</h2><table border='1' cellpadding='8' style='border-collapse:collapse;'><tr><th>Palabra</th><th>Resultado</th></tr>";
        log.forEach(l => h += `<tr><td>${l.w}</td><td style="color:${l.r === 'Acierto' ? 'green':'red'}">${l.r}</td></tr>`);
        const b = new Blob([h+"</table>"], {type:'text/html'});
        const a = document.createElement('a'); a.href=URL.createObjectURL(b); a.download="informe_silabas.html"; a.click();
    }

    function bg() {
        const b = document.getElementById('bg'), ch = "A B C D E L P S N M T O R I U".split(" ");
        b.innerHTML = "";
        for(let i=0; i<25; i++) {
            const s = document.createElement('span'); s.className='bg-char';
            s.innerText = ch[Math.floor(Math.random()*ch.length)];
            s.style.left = Math.random()*90+'vw'; s.style.animationDelay = Math.random()*10+'s';
            s.style.color = `hsl(${Math.random()*360}, 75%, 75%)`; b.appendChild(s);
        }
    }
    
    // Inicialización del entorno
    bg();
    setL('MAY');
</script>
</body>
</html>
