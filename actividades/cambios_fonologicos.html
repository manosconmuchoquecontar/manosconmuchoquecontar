<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detective de Letras - EdTech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+DE+Grund:wght@100..400&family=Playwrite+HR+Lijeva:wght@100..400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary: #4A90E2;
            --success: #48C774;
            --error: #FF3860;
            --font-caps: 'Playwrite DE Grund', sans-serif;
            --font-lower: 'Playwrite HR Lijeva', cursive;
        }

        body {
            /* Fondo con dos tonos de azul claro */
            background: linear-gradient(135deg, #e0f7fa 0%, #80deea 100%);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            position: relative;
        }

        /* Letras decorativas de fondo */
        .bg-letter {
            position: absolute;
            font-family: var(--font-caps);
            font-weight: bold;
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
            animation: float 10s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        #menu, #game-container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 850px;
            border: 6px solid white;
        }

        .hidden { display: none !important; }

        h1 { color: #2c3e50; font-size: 3rem; margin-bottom: 0.5rem; text-shadow: 2px 2px 0 white; }

        .btn-large {
            background: var(--primary);
            color: white;
            border: none;
            padding: 18px 30px;
            font-size: 1.4rem;
            border-radius: 20px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.2s;
            box-shadow: 0 6px 0 #357ABD;
            font-family: inherit;
        }

        .btn-large:active { transform: translateY(4px); box-shadow: none; }

        .selector-box {
            background: #fff;
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 30px;
            display: inline-block;
            border: 2px solid #b2ebf2;
        }

        .word-display {
            font-size: 4rem;
            margin: 30px 0;
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .word-box {
            padding: 15px 30px;
            background: #f0faff;
            border-radius: 25px;
            border: 4px solid var(--primary);
            min-width: 220px;
            color: #2c3e50;
        }

        .options-grid {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .option-btn {
            background: #fff;
            border: 4px solid #80deea;
            font-size: 3.5rem;
            width: 110px;
            height: 110px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .option-btn:hover { background: #e1f5fe; transform: scale(1.1); border-color: var(--primary); }

        .top-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        .parental-btn {
            padding: 10px 15px;
            background: #37474f;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-family: sans-serif;
            font-weight: bold;
        }

        #exit-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 10px;
            background: var(--error);
            width: 0%;
            z-index: 2000;
        }

        /* Clases de fuente según selección */
        .mode-upper { font-family: var(--font-caps); }
        .mode-lower { font-family: var(--font-lower); }
    </style>
</head>
<body class="mode-upper">

    <div id="exit-progress"></div>
    <div id="bg-decoration"></div> <div class="top-controls">
        <button class="parental-btn" id="btn-fullscreen">PANTALLA COMPLETA</button>
        <button class="parental-btn" onclick="downloadReport()">REPORTES</button>
    </div>

    <div id="menu">
        <h1>¡Hola, Detective!</h1>
        <p style="font-size: 1.4rem; color: #546e7a;">Elige cómo quieres jugar hoy:</p>
        
        <div class="selector-box">
            <select id="case-select" class="btn-large" style="background: #546e7a; box-shadow: 0 6px 0 #37474f;" onchange="updateBodyFont()">
                <option value="upper">MAYÚSCULAS</option>
                <option value="lower">minúsculas</option>
            </select>
        </div>

        <div style="display: flex; flex-wrap: wrap; justify-content: center;">
            <button class="btn-large" onclick="startGame(1)">Nivel 1</button>
            <button class="btn-large" onclick="startGame(2)">Nivel 2</button>
            <button class="btn-large" onclick="startGame(3)">Nivel 3</button>
        </div>
    </div>

    <div id="game-container" class="hidden">
        <div id="game-header">
            <span style="font-size: 1.5rem; font-weight: bold; color: var(--primary);">Reto <span id="current-idx">1</span> / 20</span>
        </div>
        <div class="word-display">
            <div class="word-box" id="word1">---</div>
            <div class="word-box" id="word2">---</div>
        </div>
        <p style="font-size: 2rem; color: #37474f;">¿Qué letra cambia?</p>
        <div class="options-grid" id="options"></div>
    </div>

    <script>
        const db = {
            1: [
                {w1: "PATO", w2: "GATO", ans: "G"}, {w1: "CASA", w2: "MASA", ans: "M"}, {w1: "BOCA", w2: "ROCA", ans: "R"},
                {w1: "LUNA", w2: "LANA", ans: "A"}, {w1: "PERRO", w2: "PERRA", ans: "A"}, {w1: "MESA", w2: "MISA", ans: "I"},
                {w1: "SOL", w2: "SAL", ans: "A"}, {w1: "TORO", w2: "LORO", ans: "L"}, {w1: "PALA", w2: "BALA", ans: "B"},
                {w1: "PIÑA", w2: "NIÑA", ans: "N"}, {w1: "MAPA", w2: "PAPA", ans: "P"}, {w1: "SAPO", w2: "CAPO", ans: "C"},
                {w1: "FOTO", w2: "MOTO", ans: "M"}, {w1: "TELA", w2: "VELA", ans: "V"}, {w1: "RANA", w2: "CANA", ans: "C"},
                {w1: "BOTA", w2: "BOLA", ans: "L"}, {w1: "KILO", w2: "HILO", ans: "H"}, {w1: "SOPA", w2: "ROPA", ans: "R"},
                {w1: "DEDO", w2: "DADO", ans: "A"}, {w1: "HIJO", w2: "HITO", ans: "T"}
            ],
            2: [
                {w1: "BOPA", w2: "DOPA", ans: "D"}, {w1: "TULI", w2: "TUMI", ans: "M"}, {w1: "FESO", w2: "FESU", ans: "U"},
                {w1: "LORA", w2: "LODA", ans: "D"}, {w1: "MIPE", w2: "NIPE", ans: "N"}, {w1: "GAVA", w2: "GANA", ans: "N"},
                {w1: "SITR", w2: "SITL", ans: "L"}, {w1: "RECO", w2: "REJO", ans: "J"}, {w1: "PULA", w2: "PUSA", ans: "S"},
                {w1: "NEDA", w2: "NEBA", ans: "B"}, {w1: "JISA", w2: "JITA", ans: "T"}, {w1: "VOME", w2: "VOMI", ans: "I"},
                {w1: "ZALU", w2: "ZALA", ans: "A"}, {w1: "QUAF", w2: "QUOF", ans: "O"}, {w1: "CHUL", w2: "CHUR", ans: "R"},
                {w1: "BALE", w2: "BALI", ans: "I"}, {w1: "DITO", w2: "DIPO", ans: "P"}, {w1: "MUCA", w2: "MUGA", ans: "G"},
                {w1: "YARA", w2: "YALA", ans: "L"}, {w1: "XEPO", w2: "XETO", ans: "T"}
            ],
            3: [
                {w1: "TRISPA", w2: "TRISLA", ans: "L"}, {w1: "BLONDO", w2: "BRONDO", ans: "R"}, {w1: "CLASTO", w2: "CRASTO", ans: "R"},
                {w1: "PLIMER", w2: "PRIMER", ans: "R"}, {w1: "FLANCO", w2: "FRANCO", ans: "R"}, {w1: "GLUCO", w2: "GRUCO", ans: "R"},
                {w1: "DRANTE", w2: "TRANTE", ans: "T"}, {w1: "SPERTA", w2: "SBERTA", ans: "B"}, {w1: "KRONTI", w2: "KRANTI", ans: "A"},
                {w1: "MISTRO", w2: "MISTRE", ans: "E"}, {w1: "PALDRO", w2: "PALDRA", ans: "A"}, {w1: "GRENFA", w2: "GRENVA", ans: "V"},
                {w1: "LUSPRE", w2: "LUSPRO", ans: "O"}, {w1: "FRIGOL", w2: "FLIGOL", ans: "L"}, {w1: "ASTRA", w2: "USTRA", ans: "U"},
                {w1: "CROMPI", w2: "CROMBI", ans: "B"}, {w1: "TRENZA", w2: "TRENVA", ans: "V"}, {w1: "PLASTU", w2: "PLASTI", ans: "I"},
                {w1: "QUILME", w2: "QUILNE", ans: "N"}, {w1: "VROSTE", w2: "VROSTA", ans: "A"}
            ]
        };

        let currentLevel = 1;
        let currentIdx = 0;
        let score = [];
        let isUpper = true;
        const synth = window.speechSynthesis;

        // Crear letras decorativas al cargar
        function createDecorations() {
            const container = document.getElementById('bg-decoration');
            const letters = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ";
            const colors = ["#FF6B6B", "#4ECDC4", "#FFEEAD", "#FF9F43", "#A29BFE"];
            
            for(let i=0; i<15; i++) {
                const el = document.createElement('div');
                el.className = 'bg-letter';
                el.textContent = letters[Math.floor(Math.random()*letters.length)];
                el.style.left = Math.random()*90 + "%";
                el.style.top = Math.random()*90 + "%";
                el.style.fontSize = (Math.random()*4 + 2) + "rem";
                el.style.color = colors[Math.floor(Math.random()*colors.length)];
                el.style.animationDelay = (Math.random()*5) + "s";
                container.appendChild(el);
            }
        }
        createDecorations();

        function updateBodyFont() {
            const val = document.getElementById('case-select').value;
            document.body.className = val === 'upper' ? 'mode-upper' : 'mode-lower';
        }

        function startGame(lvl) {
            currentLevel = lvl;
            currentIdx = 0;
            score = [];
            isUpper = document.getElementById('case-select').value === 'upper';
            updateBodyFont();
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            if (currentIdx >= 20) {
                endGame();
                return;
            }
            const data = db[currentLevel][currentIdx];
            document.getElementById('word1').textContent = isUpper ? data.w1.toUpperCase() : data.w1.toLowerCase();
            document.getElementById('word2').textContent = isUpper ? data.w2.toUpperCase() : data.w2.toLowerCase();
            document.getElementById('current-idx').textContent = currentIdx + 1;
            generateOptions(data.ans);
            speak(`¿Qué letra cambia?`);
        }

        function generateOptions(correctLetter) {
            const container = document.getElementById('options');
            container.innerHTML = '';
            let options = [correctLetter];
            const alphabet = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ";
            while(options.length < 5) {
                let char = alphabet[Math.floor(Math.random()*alphabet.length)];
                if(!options.includes(char)) options.push(char);
            }
            options.sort(() => Math.random() - 0.5);

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.style.fontFamily = isUpper ? 'var(--font-caps)' : 'var(--font-lower)';
                btn.textContent = isUpper ? opt.toUpperCase() : opt.toLowerCase();
                btn.onclick = () => checkAnswer(opt, correctLetter);
                container.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct) {
            const isCorrect = selected.toUpperCase() === correct.toUpperCase();
            score.push({ item: `${db[currentLevel][currentIdx].w1}/${db[currentLevel][currentIdx].w2}`, res: isCorrect ? "OK" : "ERROR" });

            if (isCorrect) {
                speak("¡Muy bien!");
                Swal.fire({ icon: 'success', title: '¡Excelente!', showConfirmButton: false, timer: 800 });
            } else {
                speak("No pasa nada, fíjate otra vez.");
                Swal.fire({ icon: 'error', title: '¡Casi!', text: `Era la letra ${isUpper ? correct : correct.toLowerCase()}`, showConfirmButton: false, timer: 1200 });
            }
            currentIdx++;
            setTimeout(loadQuestion, 1500);
        }

        function speak(text) {
            synth.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'es-ES';
            u.rate = 0.9;
            synth.speak(u);
        }

        function endGame() {
            speak("¡Buen trabajo! Has terminado.");
            Swal.fire({ title: '¡Fin del juego!', text: 'Has completado los 20 ejercicios.', icon: 'success' }).then(() => {
                document.getElementById('menu').classList.remove('hidden');
                document.getElementById('game-container').classList.add('hidden');
            });
        }

        // --- PARENTAL & REPORT ---
        let exitT; let prog = 0;
        const fsB = document.getElementById('btn-fullscreen');
        fsB.addEventListener('mousedown', () => {
            if(!document.fullscreenElement) { document.documentElement.requestFullscreen(); fsB.textContent="SALIR (3s)"; return; }
            exitT = setInterval(() => { prog += 2; document.getElementById('exit-progress').style.width = prog + "%";
                if(prog >= 100) { document.exitFullscreen(); clearInterval(exitT); prog=0; document.getElementById('exit-progress').style.width="0%"; }
            }, 60);
        });
        window.addEventListener('mouseup', () => { clearInterval(exitT); prog=0; document.getElementById('exit-progress').style.width="0%"; });

        function downloadReport() {
            if(score.length === 0) return;
            let txt = "REPORTE DETECTIVE:\n";
            score.forEach((s,i) => txt += `${i+1}. ${s.item}: ${s.res}\n`);
            const blob = new Blob([txt], {type:'text/plain'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'reporte.txt'; a.click();
        }
    </script>
</body>
</html>
