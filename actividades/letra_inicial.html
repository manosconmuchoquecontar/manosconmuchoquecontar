<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Letra Inicial vs Letra Final - EdTech</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+DE+Grund:wght@100..400&family=Playwrite+HR+Lijeva:wght@100..400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --verde: #81C784; --azul: #4FC3F7; --rojo: #FF5252; --fondo: #F0F7F9;
            --pastel-azul: #E1F5FE; --text-color: #34495E;
            --font-mayus: 'Playwrite DE Grund', sans-serif;
            --font-minus: 'Playwrite HR Lijeva', cursive;
        }

        body {
            background-color: var(--fondo);
            text-align: center; margin: 0; padding: 0;
            user-select: none; overflow: hidden;
            display: flex; flex-direction: column; height: 100vh; width: 100vw;
            font-family: var(--font-mayus);
        }

        .case-mayus { font-family: var(--font-mayus); text-transform: uppercase; }
        .case-minus { font-family: var(--font-minus); text-transform: lowercase; }

        /* Pantalla de Inicio */
        #start-screen {
            position: fixed; inset: 0; z-index: 2000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: radial-gradient(circle, #ffffff 0%, #e3f2fd 100%);
        }

        .floating-letter {
            position: absolute; font-weight: bold; font-size: 2.5rem; opacity: 0.15; z-index: 1; animation: float 12s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(110vh) rotate(0deg); }
            100% { transform: translateY(-10vh) rotate(360deg); }
        }

        #start-content {
            position: relative; z-index: 10; background: rgba(255, 255, 255, 0.95);
            padding: 40px; border-radius: 50px; box-shadow: 0 20px 45px rgba(0,0,0,0.06);
            border: 6px solid white; max-width: 85%;
        }

        .btn-main {
            padding: 15px 40px; font-size: 1.5rem; background: var(--verde);
            color: white; border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 6px 0 #66BB6A; transition: all 0.2s; font-family: inherit;
        }
        .btn-main:active { transform: translateY(3px); box-shadow: 0 3px 0 #66BB6A; }

        /* Juego */
        #game-container {
            display: none; flex: 1; flex-direction: column; padding: 10px;
            max-width: 1100px; margin: auto; width: 100%; box-sizing: border-box;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            background: white; padding: 10px 20px; border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04); margin-bottom: 10px;
        }

        #grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px; overflow-y: auto; padding: 10px; flex: 1;
        }

        .card {
            background: white; border: 4px solid #fff; border-radius: 35px;
            padding: 15px; cursor: pointer; transition: 0.3s; box-shadow: 0 8px 20px rgba(0,0,0,0.03);
        }
        .card .emoji { font-size: 60px; display: block; }
        .card p { font-size: 1.4rem; margin: 5px 0; color: var(--text-color); }
        .card.correct { border-color: var(--verde); background: #E8F5E9; }

        /* Modales */
        #parental-modal, #overlay {
            position: fixed; inset: 0; z-index: 5000; display: none;
            flex-direction: column; justify-content: center; align-items: center;
            background: rgba(255,255,255,0.98); padding: 20px; backdrop-filter: blur(8px);
        }

        .exit-timer-btn {
            width: 160px; height: 160px; border-radius: 50%; border: 8px solid #f5f5f5;
            background: var(--rojo); color: white; cursor: pointer;
            position: relative; overflow: hidden; margin-top: 15px;
        }
        #progress-fill { position: absolute; bottom: 0; width: 100%; background: rgba(255,255,255,0.3); height: 0%; }
    </style>
</head>
<body class="case-mayus" id="main-body">

<button id="btn-parental-access" onclick="showParental('settings')" style="position: fixed; top: 15px; right: 15px; background: white; border: 2px solid #eee; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; z-index: 3000;">⚙️</button>

<div id="start-screen">
    <div id="start-content">
        <h1 style="color: var(--text-color); margin-bottom: 20px;">Letra Inicial vs Final</h1>
        <div style="background: var(--pastel-azul); padding: 20px; border-radius: 35px; margin-bottom: 20px; border: 3px dashed #B3E5FC;">
            <button class="btn-main" style="background: #4FC3F7; box-shadow: 0 5px 0 #039BE5;" id="toggleCase" onclick="switchCase()">MAYÚSCULAS</button>
        </div>
        <button class="btn-main" onclick="startGame()">¡EMPEZAR!</button>
    </div>
</div>

<div id="game-container">
    <div class="header">
        <button onclick="showParental('home')" style="background:none; border:none; font-size: 2rem; cursor:pointer;">🏠</button>
        <div style="font-weight: bold; color: #78909C;">NIVEL: <span id="lvl">1</span></div>
        <button class="btn-main" style="font-size: 0.8rem; padding: 8px 15px; background: #90A4AE; box-shadow: 0 3px 0 #546E7A;" onclick="downloadReport()">📥 INFORME</button>
        <div style="font-weight: bold; color: #78909C;">PRUEBA: <span id="trial">1</span>/10</div>
    </div>

    <div style="background: white; padding: 20px; border-radius: 30px; margin-bottom: 10px; border-bottom: 5px solid var(--azul);">
        <div id="instruction-text" style="font-size: 1.6rem; color: #2C3E50;">...</div>
        <button style="background:var(--azul); color:white; padding:10px 20px; border-radius:50px; border:none; cursor:pointer; margin-top:10px; font-family:inherit;" onclick="repetirAudio()">🔊 ESCUCHAR</button>
    </div>

    <div id="grid"></div>
</div>

<div id="overlay">
    <div style="text-align:center;">
        <div style="font-size: 5rem;">✨</div>
        <h2 style="color:#607D8B;">¡Sigue intentándolo!</h2>
        <button class="btn-main" onclick="cerrarError()">CONTINUAR</button>
    </div>
</div>

<div id="parental-modal">
    <h2 style="font-family: sans-serif;">CONTROL PARENTAL</h2>
    <p id="math-q" style="font-size: 1.5rem; font-weight: bold; color: var(--azul);"></p>
    <input type="number" id="math-a" placeholder="?" style="font-size: 2rem; width: 120px; text-align: center; border: 4px solid var(--azul); border-radius: 15px; margin-bottom: 20px;">
    
    <div id="parental-actions">
        <button id="exit-confirm-btn" class="btn-main" style="display:none;" onclick="checkHomeReturn()">VOLVER AL INICIO</button>
        <button id="exit-hold-btn" class="exit-timer-btn" style="display:none;">
            <div id="progress-fill"></div>
            <span style="position:relative; z-index:2; font-family: sans-serif; font-weight: bold;">MANTÉN 3s<br>PARA SALIR</span>
        </button>
    </div>
    <button onclick="hideParental()" style="margin-top:30px; color: #90A4AE; background:none; border:none; text-decoration:underline; cursor:pointer;">CANCELAR</button>
</div>

<script>
    const db = [
        { n: "AVIÓN", i: "A", f: "N", e: "✈️" }, { n: "BOLA", i: "B", f: "A", e: "⚽" },
        { n: "CASA", i: "C", f: "A", e: "🏠" }, { n: "DADO", i: "D", f: "O", e: "🎲" },
        { n: "ELEFANTE", i: "E", f: "E", e: "🐘" }, { n: "FRESA", i: "F", f: "A", e: "🍓" },
        { n: "GATO", i: "G", f: "O", e: "🐱" }, { n: "HELADO", i: "H", f: "O", e: "🍦" },
        { n: "ISLA", i: "I", f: "A", e: "🏝️" }, { n: "LUNA", i: "L", f: "A", e: "🌙" },
        { n: "MANO", i: "M", f: "O", e: "✋" }, { n: "NUBE", i: "N", f: "E", e: "☁️" },
        { n: "OJO", i: "O", f: "O", e: "👁️" }, { n: "PATO", i: "P", f: "O", e: "🦆" },
        { n: "QUESO", i: "Q", f: "O", e: "🧀" }, { n: "RATÓN", i: "R", f: "N", e: "🐭" },
        { n: "SOL", i: "S", f: "L", e: "☀️" }, { n: "TREN", i: "T", f: "N", e: "🚂" },
        { n: "UVA", i: "U", f: "A", e: "🍇" }
    ];

    let nivel = 1, prueba = 1, correcta = null, modo = "inicial", bloqueado = false;
    let logs = [];
    let isMayus = true, mathRes = 0, exitProgress = 0, exitInterval;

    function switchCase() {
        isMayus = !isMayus;
        document.getElementById('toggleCase').innerText = isMayus ? "MAYÚSCULAS" : "minúsculas";
        document.getElementById('main-body').className = isMayus ? "case-mayus" : "case-minus";
    }

    function startGame() {
        document.documentElement.requestFullscreen().catch(() => {});
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('game-container').style.display = 'flex';
        iniciarPrueba();
    }

    function iniciarPrueba() {
        bloqueado = false;
        const grid = document.getElementById('grid');
        grid.innerHTML = "";
        modo = Math.random() > 0.5 ? "inicial" : "final";
        correcta = db[Math.floor(Math.random() * db.length)];
        
        const letraObjetivo = modo === "inicial" ? correcta.i : correcta.f;
        let distractores = db.filter(p => (modo === "inicial" ? p.i : p.f) !== letraObjetivo)
                             .sort(() => 0.5 - Math.random()).slice(0, Math.min(nivel + 1, 6));
        let opciones = [...distractores, correcta].sort(() => 0.5 - Math.random());

        opciones.forEach(p => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<span class="emoji">${p.e}</span><p>${p.n}</p>`;
            card.onclick = () => verificar(p, card);
            grid.appendChild(card);
        });
        actualizarInterfaz();
    }

    function actualizarInterfaz() {
        const letra = modo === "inicial" ? correcta.i : correcta.f;
        const tipo = modo === "inicial" ? "EMPIEZA" : "TERMINA";
        const texto = `¿QUÉ PALABRA ${tipo} CON LA LETRA ${letra}?`;
        document.getElementById('instruction-text').innerText = texto;
        document.getElementById('lvl').innerText = nivel;
        document.getElementById('trial').innerText = prueba;
        decir(texto);
    }

    function decir(t) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t.toLowerCase());
        m.lang = 'es-ES'; m.rate = 0.8;
        window.speechSynthesis.speak(m);
    }

    function repetirAudio() { actualizarInterfaz(); }

    function verificar(p, el) {
        if(bloqueado) return;
        const esCorrecta = p.n === correcta.n;
        const timestamp = new Date().toLocaleTimeString();
        if(esCorrecta) {
            bloqueado = true;
            el.classList.add('correct');
            logs.push({ h: timestamp, r: "ACIERTO", m: modo, obj: correcta.n, sel: p.n, l: nivel });
            setTimeout(() => {
                prueba++;
                if(prueba > 10) { nivel++; prueba = 1; }
                iniciarPrueba();
            }, 1200);
        } else {
            bloqueado = true;
            logs.push({ h: timestamp, r: "FALLO", m: modo, obj: correcta.n, sel: p.n, l: nivel });
            document.getElementById('overlay').style.display = 'flex';
        }
    }

    function cerrarError() {
        document.getElementById('overlay').style.display = 'none';
        bloqueado = false;
    }

    // Parental Logic
    function showParental(target) {
        const n1 = Math.floor(Math.random() * 8) + 2;
        const n2 = Math.floor(Math.random() * 7) + 1;
        mathRes = n1 + n2;
        document.getElementById('math-q').innerText = `¿Cuánto es ${n1} + ${n2}?`;
        document.getElementById('math-a').value = "";
        document.getElementById('parental-modal').style.display = 'flex';
        document.getElementById('exit-confirm-btn').style.display = (target === 'home') ? 'block' : 'none';
        document.getElementById('exit-hold-btn').style.display = (target === 'settings') ? 'block' : 'none';
    }

    function hideParental() { document.getElementById('parental-modal').style.display = 'none'; }

    function checkHomeReturn() {
        if(parseInt(document.getElementById('math-a').value) === mathRes) location.reload();
    }

    const holdBtn = document.getElementById('exit-hold-btn');
    function startTimer() {
        if(parseInt(document.getElementById('math-a').value) !== mathRes) return;
        exitInterval = setInterval(() => {
            exitProgress += 2;
            document.getElementById('progress-fill').style.height = exitProgress + "%";
            if(exitProgress >= 100) { clearInterval(exitInterval); location.reload(); }
        }, 60);
    }
    function stopTimer() { clearInterval(exitInterval); exitProgress = 0; document.getElementById('progress-fill').style.height = "0%"; }

    holdBtn.addEventListener('mousedown', startTimer);
    holdBtn.addEventListener('touchstart', startTimer);
    window.addEventListener('mouseup', stopTimer);
    window.addEventListener('touchend', stopTimer);

    function downloadReport() {
        let html = `<html><head><meta charset="utf-8"></head><body><h1>Informe Fonológico</h1><table border="1">
            <tr><th>Hora</th><th>Nivel</th><th>Modo</th><th>Objetivo</th><th>Seleccionado</th><th>Resultado</th></tr>
            ${logs.map(l=>`<tr><td>${l.h}</td><td>${l.l}</td><td>${l.m}</td><td>${l.obj}</td><td>${l.sel}</td><td>${l.r}</td></tr>`).join('')}
        </table></body></html>`;
        const blob = new Blob([html], {type:'text/html'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "informe_educativo.html";
        a.click();
    }

    // Bg animation
    const letters = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ";
    for(let i=0; i<20; i++) {
        const span = document.createElement('span');
        span.className = 'floating-letter';
        span.innerText = letters[Math.floor(Math.random() * letters.length)];
        span.style.left = Math.random() * 100 + "vw";
        span.style.animationDelay = Math.random() * 10 + "s";
        span.style.color = `hsl(${Math.random() * 360}, 60%, 80%)`;
        document.getElementById('start-screen').appendChild(span);
    }
</script>
</body>
</html>
