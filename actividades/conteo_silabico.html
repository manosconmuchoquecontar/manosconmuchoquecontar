<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EdTech - Conciencia Silábica Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Short+Stack&display=swap" rel="stylesheet">
    
    <style>
        /* Tipografía Massallera con respaldo escolar */
        @font-face {
            font-family: 'Massallera';
            src: local('Massallera'), local('Escolar'), local('Edelfontmed');
        }

        :root {
            --primary: #4CAF50;
            --secondary: #FF9800;
            --error: #f44336;
            --bg: #E8F5E9;
            --text: #1B5E20;
            --font-escolar: 'Massallera', 'Short Stack', cursive;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: var(--font-escolar);
            background-color: var(--bg);
            color: var(--text);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; user-select: none;
        }

        /* --- ANTESALA --- */
        #welcome-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #4CAF50, #1B5E20);
            z-index: 5000; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; color: white; text-align: center;
        }

        .card-welcome {
            background: white; padding: 40px; border-radius: 40px;
            color: #333; box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            max-width: 500px; width: 85%;
        }

        /* --- ÁREA DE JUEGO --- */
        #main-game { display: none; flex-direction: column; align-items: center; width: 100%; height: 100%; }

        #ui-layer {
            width: 100%; padding: 15px; display: flex; 
            justify-content: space-between; box-sizing: border-box; z-index: 10;
        }

        .btn-control {
            padding: 10px 20px; border-radius: 12px; border: none;
            cursor: pointer; font-weight: bold; font-family: var(--font-escolar);
            box-shadow: 0 4px #ccc;
        }

        #game-area {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; width: 90%; max-width: 600px;
        }

        .word-display {
            background: white; padding: 30px; border-radius: 40px;
            box-shadow: 0 15px 0 rgba(0,0,0,0.05); margin-bottom: 30px;
            text-align: center; width: 100%;
        }

        h1 { font-size: clamp(3.5rem, 12vw, 5.5rem); margin: 10px 0; color: var(--primary); text-transform: uppercase; }

        .options-container { display: flex; gap: 15px; width: 100%; justify-content: center; }

        .option-btn {
            width: 100px; height: 100px; font-size: 3rem;
            border: 4px solid var(--primary); background: white;
            border-radius: 25px; cursor: pointer; transition: 0.2s;
            color: var(--primary); font-family: var(--font-escolar);
            box-shadow: 0 8px 0 var(--primary);
        }

        .option-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--primary); }
        .correct { background: var(--primary) !important; color: white !important; }
        .wrong { background: var(--error) !important; color: white !important; border-color: #b71c1c !important; }

        /* --- CONTROL PARENTAL --- */
        #parental-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 9999;
            color: white; justify-content: center; align-items: center; flex-direction: column;
        }
        #parental-modal input { font-size: 2rem; width: 120px; text-align: center; border-radius: 10px; margin: 20px; }
    </style>
</head>
<body>

    <div id="welcome-screen">
        <div class="card-welcome">
            <h1 style="font-size: 2.5rem;">🎒 Conteo Silábico</h1>
            <p>Aprenderemos a separar las palabras en trocitos.</p>
            <button class="btn-control" style="background: var(--primary); color: white; font-size: 1.5rem; padding: 20px;" onclick="initApp()">¡VAMOS ALLÁ!</button>
        </div>
    </div>

    <div id="main-game">
        <div id="ui-layer">
            <button class="btn-control" onclick="askPermission()" style="background: var(--secondary); color: white;">🔒 SALIR</button>
            <button class="btn-control" onclick="downloadReport()" style="background: #9c27b0; color: white;">📊 INFORME</button>
        </div>

        <div id="game-area">
            <div class="word-display">
                <p style="font-size: 1.5rem; margin: 0; color: #666;">¿Cuántas sílabas tiene?</p>
                <h1 id="target-word">---</h1>
            </div>
            <div class="options-container" id="options"></div>
        </div>
    </div>

    <div id="parental-modal">
        <h2>CONTROL PARENTAL</h2>
        <p>Resuelve la suma para salir:</p>
        <div id="math-exp" style="font-size: 3rem; color: #ffeb3b; margin: 10px;"></div>
        <input type="number" id="math-answer">
        <div>
            <button class="btn-control" style="background: var(--primary); color: white;" onclick="verifyParental()">VERIFICAR</button>
            <button class="btn-control" onclick="closeParental()">CANCELAR</button>
        </div>
    </div>

    <script>
        let words = [
            { w: "PAN", s: 1 }, { w: "SOL", s: 1 }, { w: "FLOR", s: 1 }, { w: "PEZ", s: 1 },
            { w: "CASA", s: 2 }, { w: "LÁPIZ", s: 2 }, { w: "PERRO", s: 2 }, { w: "LUNA", s: 2 },
            { w: "TOMATE", s: 3 }, { w: "ESTRELLA", s: 3 }, { w: "CABALLO", s: 3 }, { w: "PÁJARO", s: 3 },
            { w: "TELÉFONO", s: 4 }, { w: "MARIPOSA", s: 4 }, { w: "ELEFANTE", s: 4 },
            { w: "HIPOPÓTAMO", s: 5 }, { w: "CALCULADORA", s: 5 }
        ];

        let currentWordIndex = 0, stats = [], extraAttempts = 0, expectedMath = 0;
        const synth = window.speechSynthesis;

        function initApp() {
            const doc = document.documentElement;
            if (doc.requestFullscreen) doc.requestFullscreen();
            else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();

            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('main-game').style.display = 'flex';
            
            shuffle(words);
            initLevel();
        }

        function speak(text) {
            synth.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'es-ES';
            u.rate = 0.7; // Velocidad pausada
            synth.speak(u);
        }

        function initLevel() {
            const data = words[currentWordIndex];
            document.getElementById('target-word').innerText = data.w;
            extraAttempts = 0;
            
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';

            let choices = new Set([data.s]);
            while(choices.size < 3) {
                choices.add(Math.max(1, data.s + (Math.floor(Math.random() * 3) - 1)));
            }
            
            Array.from(choices).sort((a,b) => a-b).forEach(val => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = val;
                btn.onclick = () => checkAnswer(val, btn);
                optionsDiv.appendChild(btn);
            });

            speak(`¿Cuántas sílabas tiene ${data.w}?`);
        }

        function checkAnswer(selected, btn) {
            const correct = words[currentWordIndex].s;
            if (selected === correct) {
                btn.classList.add('correct');
                speak("¡Muy bien!");
                stats.push({ word: words[currentWordIndex].w, success: extraAttempts === 0 });
                
                setTimeout(() => {
                    currentWordIndex++;
                    if (currentWordIndex < words.length) initLevel();
                    else Swal.fire('¡Felicidades!', 'Has terminado el ejercicio.', 'success');
                }, 1500);
            } else {
                btn.classList.add('wrong');
                extraAttempts++;
                speak("Vuelve a contar.");
            }
        }

        // --- CONTROL PARENTAL MATEMÁTICO ---
        function askPermission() {
            const n1 = Math.floor(Math.random() * 9) + 2;
            const n2 = Math.floor(Math.random() * 9) + 2;
            expectedMath = n1 + n2;
            document.getElementById('math-exp').innerText = `${n1} + ${n2} = ?`;
            document.getElementById('math-answer').value = "";
            document.getElementById('parental-modal').style.display = 'flex';
        }

        function verifyParental() {
            if (parseInt(document.getElementById('math-answer').value) === expectedMath) {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                location.reload();
            } else {
                Swal.fire('Atención', 'Resultado incorrecto', 'error');
                closeParental();
            }
        }

        function closeParental() { document.getElementById('parental-modal').style.display = 'none'; }

        // --- INFORME DESCARGABLE ---
        function downloadReport() {
            let txt = "INFORME DE CONCIENCIA SILÁBICA\n\n";
            stats.forEach((s, i) => {
                txt += `${i+1}. ${s.word}: ${s.success ? 'Acierto Directo' : 'Necesitó ayuda'}\n`;
            });
            const blob = new Blob([txt], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'informe_silabas.txt';
            a.click();
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }
    </script>
</body>
</html>
