<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto | Manos con Mucho que Contar</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤲</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;0,900;1,700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5FAFA; --bg2: #E8F4F2; --ink: #1A3A38; --ink2: #4A706D; --ink3: #8AADAA;
    --coral: #2A9D8F; --border: rgba(26,58,56,0.10); --radius: 20px;
  }
  body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--ink); margin: 0; }
  nav { background: white; border-bottom: 1px solid var(--border); padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 64px; position: sticky; top: 0; z-index: 100; }
  .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
  .logo-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--coral); display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .logo-text { font-family: 'Fraunces', serif; font-size: 15px; font-weight: 700; line-height: 1.2; }
  nav ul { list-style: none; display: flex; gap: 2rem; }
  nav ul a { text-decoration: none; color: var(--ink2); font-size: 14px; font-weight: 500; }
  .section { max-width: 800px; margin: 4rem auto; padding: 2rem; background: white; border-radius: var(--radius); border: 1px solid var(--border); }
  input, textarea { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border); font-family: 'Nunito', sans-serif; margin-bottom: 1.2rem; box-sizing: border-box; }
  .btn-primary { background: var(--coral); color: white; padding: 16px; border-radius: 100px; text-decoration: none; display: block; text-align: center; font-weight: 600; border: none; cursor: pointer; width: 100%; font-size: 16px; }
  footer { text-align: center; padding: 2rem; font-size: 13px; color: var(--ink3); }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">
    <div class="logo-icon">🤲</div>
    <div class="logo-text">Manos con Mucho que Contar</div>
  </a>
  <ul>
    <li><a href="index.html">Actividades</a></li>
    <li><a href="contacto.html" style="color: var(--coral); font-weight: 700;">Contacto</a></li>
    <li><a href="sobre-mi.html">Sobre mí</a></li>
  </ul>
</nav>

<div class="section">
  <h1 style="font-family: 'Fraunces', serif; text-align: center;">¿Hablamos?</h1>
  <p style="text-align: center; color: var(--ink2); margin-bottom: 2.5rem;">Escríbeme para cualquier duda, sugerencia o colaboración.</p>
  
  <form action="https://formspree.io/f/xeevvjjq" method="POST">
    <label style="font-weight: 700; display: block; margin-bottom: 0.5rem;">Nombre</label>
    <input type="text" name="name" required placeholder="Tu nombre">
    
    <label style="font-weight: 700; display: block; margin-bottom: 0.5rem;">Correo electrónico</label>
    <input type="email" name="_replyto" required placeholder="tu@email.com">
    
    <label style="font-weight: 700; display: block; margin-bottom: 0.5rem;">Mensaje</label>
    <textarea name="message" required placeholder="¿En qué puedo ayudarte?" style="min-height: 150px;"></textarea>
    
    <button type="submit" class="btn-primary">Enviar mensaje</button>
  </form>
</div>

<footer>
  <a href="index.html" style="color: var(--coral); text-decoration: none;">← Volver al inicio</a>
  <br><br>
  © 2025 · Inma Merino Rus
</footer>

</body>
</html>
